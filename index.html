<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Line Slash</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    background: #050505;
    overflow: hidden;
}

/* 스테이지 */

#stage {
    position: absolute;
    top: 20px;
    left: 20px;

    color: white;
    font-size: 20px;

    z-index: 10;
}

/* 선 개수 */

#lineCount {
    position: absolute;
    top: 20px;
    right: 20px;

    color: white;
    font-size: 20px;

    z-index: 10;
}

/* 캔버스 */

canvas {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}

/* 플레이어 */

#player {
    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform: translate(-50%, -50%);

    z-index: 5;
}

/* 적 */

.enemy {
    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform: translate(-50%, -50%);

    z-index: 4;

    transition: opacity 0.12s;
}

/* 베기 버튼 */

#slashButton {

    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;
    border-radius: 15px;

    background: white;
    color: black;

    font-size: 20px;
    font-weight: bold;

    z-index: 20;
}

#slashButton:active {
    transform: translateX(-50%) scale(0.95);
}

#slashButton:disabled {
    opacity: 0.5;
}

</style>
</head>


<body>

<div id="game">

    <div id="stage">
        STAGE 1
    </div>

    <div id="lineCount">
        선: 2 / 2
    </div>

    <canvas id="canvas"></canvas>

    <div id="player"></div>

    <button id="slashButton">
        ⚔ 베기
    </button>

</div>


<script>

// ==================================
// 기본 요소
// ==================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById("player");

const slashButton =
    document.getElementById("slashButton");

const stageText =
    document.getElementById("stage");

const lineCountText =
    document.getElementById("lineCount");


// ==================================
// 게임 변수
// ==================================

let width;
let height;

let stage = 1;

let playerPos = {
    x: 0,
    y: 0
};


// 적 목록

let enemies = [];


// 현재 스테이지의 최대 선 개수

let maxLines = 2;


// 그어진 선

let lines = [];


// 현재 그리고 있는 선

let currentLine = null;


// 드래그 여부

let dragging = false;


// 베기 중인지

let attacking = false;


// ==================================
// 플레이어 초기 위치
// ==================================

function resetPlayerPosition() {

    playerPos.x =
        width / 2;

    playerPos.y =
        height * 0.72;

    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";
}


// ==================================
// 화면 크기
// ==================================

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;

    resetPlayerPosition();

    draw();
}

window.addEventListener(
    "resize",
    resize
);


// ==================================
// 적 수
// ==================================

function getEnemyCount() {

    let count =
        Math.floor(stage / 5);

    count =
        Math.max(1, count);

    count =
        Math.min(7, count);

    return count;
}


// ==================================
// 선 개수 계산
// ==================================

function updateMaxLines() {

    const enemyCount =
        getEnemyCount();

    // 적 수 - 1
    // 최소 2

    maxLines =
        Math.max(
            2,
            enemyCount - 1
        );

}


// ==================================
// 선 개수 표시
// ==================================

function updateLineCount() {

    const remaining =
        maxLines - lines.length;

    lineCountText.textContent =
        `선: ${remaining} / ${maxLines}`;

}


// ==================================
// 적 생성
// ==================================

function spawnEnemies() {

    // 기존 적 제거

    enemies.forEach(
        enemy => enemy.remove()
    );

    enemies = [];


    const enemyCount =
        getEnemyCount();


    for (
        let i = 0;
        i < enemyCount;
        i++
    ) {

        const enemy =
            document.createElement("div");

        enemy.classList.add("enemy");


        let x;
        let y;

        let validPosition = false;


        while (!validPosition) {

            x =
                Math.random()
                * (width - 100)
                + 50;


            y =
                Math.random()
                * (height * 0.55)
                + 80;


            validPosition = true;


            // 플레이어와 너무 가까우면 다시

            const playerDistance =
                Math.sqrt(

                    (x - playerPos.x) ** 2 +

                    (y - playerPos.y) ** 2

                );


            if (playerDistance < 150) {

                validPosition = false;

            }


            // 다른 적과 너무 가까운지 확인

            for (
                const other of enemies
            ) {

                const rect =
                    other.getBoundingClientRect();


                const otherX =
                    rect.left +
                    rect.width / 2;

                const otherY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        (x - otherX) ** 2 +

                        (y - otherY) ** 2

                    );


                if (distance < 80) {

                    validPosition = false;

                    break;

                }

            }

        }


        enemy.style.left =
            x + "px";

        enemy.style.top =
            y + "px";


        game.appendChild(enemy);

        enemies.push(enemy);

    }

}


// ==================================
// 현재 적 위치 저장
// ==================================
//
// 실패 시 적 위치를 유지하기 위해
// 현재 위치를 저장해 둔다.
//

function saveEnemyPositions() {

    return enemies.map(
        enemy => {

            return {

                x:
                    parseFloat(
                        enemy.style.left
                    ),

                y:
                    parseFloat(
                        enemy.style.top
                    )

            };

        }
    );

}


// ==================================
// 적 위치 그대로 복구
// ==================================

function restoreEnemies() {

    enemies.forEach(
        (enemy, index) => {

            const saved =
                savedEnemyPositions[index];

            if (!saved)
                return;


            enemy.style.left =
                saved.x + "px";

            enemy.style.top =
                saved.y + "px";


            // 죽은 적도 부활

            enemy.style.display =
                "block";

            enemy.style.opacity =
                "1";

        }
    );

}


// 실패 시 사용할 적 위치

let savedEnemyPositions = [];


// ==================================
// 터치 위치
// ==================================

function getTouchPosition(e) {

    const touch =
        e.touches[0];

    return {

        x: touch.clientX,

        y: touch.clientY

    };

}


// ==================================
// 터치 시작
// ==================================

game.addEventListener(
    "touchstart",
    function(e) {

        // 베기 중에는 입력 불가

        if (attacking)
            return;


        // 베기 버튼이면 제외

        if (e.target === slashButton)
            return;


        // 선 개수 제한

        if (
            lines.length >=
            maxLines
        ) {

            return;

        }


        e.preventDefault();

        dragging = true;


        const pos =
            getTouchPosition(e);


        let start;


        // 첫 번째 선

        if (lines.length === 0) {

            start = {

                x: playerPos.x,

                y: playerPos.y

            };

        }

        // 이후 선

        else {

            const last =
                lines[lines.length - 1];


            start = {

                x: last.end.x,

                y: last.end.y

            };

        }


        currentLine = {

            start: start,

            end: pos

        };


        draw();

    },
    { passive: false }
);


// ==================================
// 드래그
// ==================================

game.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;


        e.preventDefault();


        const pos =
            getTouchPosition(e);


        currentLine.end =
            pos;


        draw();

    },
    { passive: false }
);


// ==================================
// 터치 종료
// ==================================

game.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;


        dragging = false;


        if (currentLine) {

            lines.push(
                currentLine
            );

            currentLine = null;

        }


        updateLineCount();

        draw();

    }
);


// ==================================
// 선 그리기
// ==================================

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.strokeStyle = "white";


    // 고정된 선

    for (
        const line of lines
    ) {

        ctx.beginPath();

        ctx.moveTo(
            line.start.x,
            line.start.y
        );

        ctx.lineTo(
            line.end.x,
            line.end.y
        );

        ctx.stroke();

    }


    // 현재 드래그 중인 선

    if (currentLine) {

        ctx.beginPath();

        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );

        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );

        ctx.stroke();

    }

}


// ==================================
// 점과 선 사이 거리
// ==================================

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return Math.sqrt(

            (p.x - a.x) ** 2 +

            (p.y - a.y) ** 2

        );

    }


    const t =
        (

            (p.x - a.x) * dx +

            (p.y - a.y) * dy

        )
        /
        (
            dx * dx +
            dy * dy
        );


    const clamped =
        Math.max(
            0,
            Math.min(1, t)
        );


    const closest = {

        x:
            a.x +
            clamped * dx,

        y:
            a.y +
            clamped * dy

    };


    return Math.sqrt(

        (p.x - closest.x) ** 2 +

        (p.y - closest.y) ** 2

    );

}


// ==================================
// 적 공격
// ==================================

function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            )
                return;


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };


            const distance =
                pointToLineDistance(

                    enemyPos,

                    start,

                    current

                );


            if (
                distance < 30
            ) {

                enemy.style.opacity =
                    "0";

                enemy.style.display =
                    "none";

            }

        }
    );

}


// ==================================
// 베기 버튼
// ==================================

slashButton.addEventListener(
    "click",
    function() {

        if (attacking)
            return;


        if (lines.length === 0)
            return;


        attacking = true;

        slashButton.disabled =
            true;


        // 베기 시작 전에
        // 현재 적 배치를 저장

        savedEnemyPositions =
            saveEnemyPositions();


        moveAlongPath(0);

    }
);


// ==================================
// 경로 이동
// ==================================

function moveAlongPath(index) {

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            finishAttack,
            100
        );

        return;

    }


    const line =
        lines[index];


    const start =
        line.start;

    const end =
        line.end;


    // 매우 빠른 속도

    const duration = 120;


    const startTime =
        performance.now();


    function animate(time) {

        const progress =
            Math.min(

                (time - startTime)
                / duration,

                1

            );


        playerPos.x =
            start.x +
            (end.x - start.x)
            * progress;


        playerPos.y =
            start.y +
            (end.y - start.y)
            * progress;


        player.style.left =
            playerPos.x + "px";

        player.style.top =
            playerPos.y + "px";


        checkEnemyHit(

            start,

            {
                x: playerPos.x,
                y: playerPos.y
            }

        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


// ==================================
// 베기 종료
// ==================================

function finishAttack() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;

            }

        }
    );


    attacking = false;


    // ==================================
    // 성공
    // ==================================

    if (alive === 0) {

        setTimeout(
            nextStage,
            300
        );

    }


    // ==================================
    // 실패
    // ==================================

    else {

        setTimeout(
            restartStage,
            300
        );

    }

}


// ==================================
// 스테이지 실패 → 재시작
// ==================================

function restartStage() {

    // 선 삭제

    lines = [];

    currentLine = null;


    // 플레이어 원위치

    resetPlayerPosition();


    /*
       ★ 중요

       spawnEnemies()를 호출하지 않는다.

       따라서 적의 위치는 그대로 유지된다.
    */

    restoreEnemies();


    // 선 개수 초기화

    updateLineCount();


    draw();


    slashButton.disabled =
        false;

    attacking = false;

}


// ==================================
// 다음 스테이지
// ==================================

function nextStage() {

    stage++;


    stageText.textContent =
        "STAGE " + stage;


    // 플레이어 원위치

    resetPlayerPosition();


    // 선 삭제

    lines = [];

    currentLine = null;


    // 다음 스테이지는
    // 새로운 적 위치 생성

    spawnEnemies();


    // 적 수에 맞춰
    // 선 제한 재계산

    updateMaxLines();

    updateLineCount();


    draw();


    slashButton.disabled =
        false;

    attacking = false;

}


// ==================================
// 게임 시작
// ==================================

resize();

updateMaxLines();

updateLineCount();

spawnEnemies();

</script>

</body>
</html>
