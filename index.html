<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Line Slash</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #game {
        position: relative;
        width: 100%;
        height: 100%;
        background: #050505;
        overflow: hidden;
    }

    /* 스테이지 표시 */
    #stage {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 20px;
        z-index: 10;
    }

    /* 캔버스 */
    canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
    }

    /* 플레이어 */
    #player {
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: white;

        transform: translate(-50%, -50%);
        z-index: 5;
    }

    /* 적 */
    .enemy {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;

        background: #d33;

        transform: translate(-50%, -50%);
        z-index: 4;

        transition: opacity 0.2s;
    }

    /* 베기 버튼 */
    #slashButton {
        position: absolute;

        left: 50%;
        bottom: 25px;

        transform: translateX(-50%);

        width: 150px;
        height: 60px;

        border: none;
        border-radius: 15px;

        background: white;
        color: black;

        font-size: 20px;
        font-weight: bold;

        z-index: 20;
    }

    #slashButton:active {
        transform: translateX(-50%) scale(0.95);
    }

</style>
</head>

<body>

<div id="game">

    <div id="stage">STAGE 1</div>

    <canvas id="canvas"></canvas>

    <div id="player"></div>

    <div class="enemy" id="enemy1"></div>
    <div class="enemy" id="enemy2"></div>

    <button id="slashButton">⚔ 베기</button>

</div>


<script>

const game = document.getElementById("game");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const player = document.getElementById("player");
const enemies = [
    document.getElementById("enemy1"),
    document.getElementById("enemy2")
];

const slashButton = document.getElementById("slashButton");

let width;
let height;

let playerPos = {
    x: 0,
    y: 0
};

// 지금까지 만들어진 경로
let lines = [];

// 현재 드래그 중인 선
let currentLine = null;

let dragging = false;


// ----------------------------------
// 화면 크기
// ----------------------------------

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    // 플레이어는 화면 아래쪽
    playerPos.x = width / 2;
    playerPos.y = height * 0.72;

    player.style.left = playerPos.x + "px";
    player.style.top = playerPos.y + "px";

    draw();

}

window.addEventListener("resize", resize);


// ----------------------------------
// 적 배치
// ----------------------------------

function placeEnemies() {

    enemies.forEach(e => {

        e.style.display = "block";
        e.style.opacity = "1";

    });

    // 첫 번째 적
    enemies[0].style.left = width * 0.30 + "px";
    enemies[0].style.top = height * 0.35 + "px";

    // 두 번째 적
    enemies[1].style.left = width * 0.70 + "px";
    enemies[1].style.top = height * 0.45 + "px";
}


// ----------------------------------
// 거리 계산
// ----------------------------------

function distance(a, b) {

    return Math.sqrt(
        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2
    );

}


// ----------------------------------
// 점과 선분 사이 거리
// ----------------------------------

function pointToLineDistance(p, a, b) {

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    if (dx === 0 && dy === 0) {
        return distance(p, a);
    }

    const t =
        ((p.x - a.x) * dx +
         (p.y - a.y) * dy)
        /
        (dx * dx + dy * dy);

    const clamped = Math.max(0, Math.min(1, t));

    const closest = {
        x: a.x + clamped * dx,
        y: a.y + clamped * dy
    };

    return distance(p, closest);
}


// ----------------------------------
// 화면 좌표
// ----------------------------------

function getTouchPosition(e) {

    const touch = e.touches[0];

    return {
        x: touch.clientX,
        y: touch.clientY
    };

}


// ----------------------------------
// 드래그 시작
// ----------------------------------

game.addEventListener("touchstart", function(e) {

    // 버튼을 누른 경우 제외
    if (e.target === slashButton) return;

    e.preventDefault();

    dragging = true;

    const pos = getTouchPosition(e);

    let start;

    // 처음 선이면 플레이어에서 시작
    if (lines.length === 0) {

        start = {
            x: playerPos.x,
            y: playerPos.y
        };

    }

    // 이미 선이 있다면 마지막 선의 끝에서 시작
    else {

        const last = lines[lines.length - 1];

        start = {
            x: last.end.x,
            y: last.end.y
        };

    }

    currentLine = {
        start: start,
        end: pos
    };

    draw();

}, { passive: false });


// ----------------------------------
// 드래그 중
// ----------------------------------

game.addEventListener("touchmove", function(e) {

    if (!dragging) return;

    e.preventDefault();

    const pos = getTouchPosition(e);

    currentLine.end = pos;

    draw();

}, { passive: false });


// ----------------------------------
// 손을 뗌
// ----------------------------------

game.addEventListener("touchend", function(e) {

    if (!dragging) return;

    dragging = false;

    if (currentLine) {

        lines.push(currentLine);

        currentLine = null;

    }

    draw();

});


// ----------------------------------
// 선 그리기
// ----------------------------------

function draw() {

    ctx.clearRect(0, 0, width, height);

    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "white";

    // 고정된 선
    for (const line of lines) {

        ctx.beginPath();

        ctx.moveTo(
            line.start.x,
            line.start.y
        );

        ctx.lineTo(
            line.end.x,
            line.end.y
        );

        ctx.stroke();

    }

    // 현재 드래그 중인 선
    if (currentLine) {

        ctx.beginPath();

        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );

        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );

        ctx.stroke();

    }

}


// ----------------------------------
// 베기
// ----------------------------------

slashButton.addEventListener("click", function() {

    if (lines.length === 0) return;

    slashButton.disabled = true;

    // 경로를 따라 플레이어 이동
    moveAlongPath(0);

});


// ----------------------------------
// 경로를 따라 이동
// ----------------------------------

function moveAlongPath(index) {

    if (index >= lines.length) {

        setTimeout(() => {

            checkStageClear();

        }, 300);

        return;
    }

    const line = lines[index];

    const start = line.start;
    const end = line.end;

    const duration = 350;

    const startTime = performance.now();

    function animate(time) {

        const progress =
            Math.min(
                (time - startTime) / duration,
                1
            );

        playerPos.x =
            start.x +
            (end.x - start.x) * progress;

        playerPos.y =
            start.y +
            (end.y - start.y) * progress;

        player.style.left =
            playerPos.x + "px";

        player.style.top =
            playerPos.y + "px";

        // 이동하면서 적 체크
        checkEnemyHit(start, {
            x: playerPos.x,
            y: playerPos.y
        });

        if (progress < 1) {

            requestAnimationFrame(animate);

        } else {

            moveAlongPath(index + 1);

        }

    }

    requestAnimationFrame(animate);

}


// ----------------------------------
// 적 공격 판정
// ----------------------------------

function checkEnemyHit(start, current) {

    enemies.forEach(enemy => {

        if (enemy.style.display === "none") return;

        const rect =
            enemy.getBoundingClientRect();

        const enemyPos = {

            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2

        };

        const d =
            pointToLineDistance(
                enemyPos,
                start,
                current
            );

        // 선에서 30px 이내면 맞음
        if (d < 30) {

            enemy.style.opacity = "0";

            setTimeout(() => {

                enemy.style.display = "none";

            }, 200);

        }

    });

}


// ----------------------------------
// 스테이지 클리어
// ----------------------------------

function checkStageClear() {

    let alive = 0;

    enemies.forEach(enemy => {

        if (enemy.style.display !== "none") {
            alive++;
        }

    });

    if (alive === 0) {

        setTimeout(() => {

            nextStage();

        }, 500);

    } else {

        slashButton.disabled = false;

    }

}


// ----------------------------------
// 다음 스테이지
// ----------------------------------

let stage = 1;

function nextStage() {

    stage++;

    document.getElementById("stage").textContent =
        "STAGE " + stage;

    lines = [];

    playerPos.x = width / 2;
    playerPos.y = height * 0.72;

    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";

    placeEnemies();

    slashButton.disabled = false;

    draw();

}


// ----------------------------------
// 시작
// ----------------------------------

resize();
placeEnemies();

</script>

</body>
</html>
