<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Line Slash</title>

<style>

* {
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

html, body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;
}


/* ==============================
   스테이지
================================ */

#stage {

    position: absolute;

    top: 20px;
    left: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   선 개수
================================ */

#lineCount {

    position: absolute;

    top: 20px;
    right: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   Canvas
================================ */

canvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 6;

    pointer-events: none;
}


/* ==============================
   플레이어
================================ */

#player {

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    z-index: 5;

    box-shadow:
        0 0 10px white,
        0 0 20px white;
}


/* ==============================
   적
================================ */

.enemy {

    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform:
        translate(-50%, -50%);

    z-index: 4;

    box-shadow:
        0 0 10px #d33;

    transition:
        opacity 0.08s;
}


/* ==============================
   베기 버튼
================================ */

#slashButton {

    position: absolute;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;

    border-radius: 15px;

    background: white;

    color: black;

    font-size: 20px;

    font-weight: bold;

    z-index: 20;
}


#slashButton:active {

    transform:
        translateX(-50%)
        scale(0.95);
}


#slashButton:disabled {

    opacity: 0.5;
}

</style>

</head>


<body>

<div id="game">

    <div id="stage">
        STAGE 1
    </div>

    <div id="lineCount">
        선: 2 / 2
    </div>

    <canvas id="canvas"></canvas>

    <div id="player"></div>

    <button id="slashButton">
        ⚔ 베기
    </button>

</div>


<script>


// ======================================================
// 기본 요소
// ======================================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById("player");

const slashButton =
    document.getElementById("slashButton");

const stageText =
    document.getElementById("stage");

const lineCountText =
    document.getElementById("lineCount");


// ======================================================
// 기본 변수
// ======================================================

let width;
let height;

let stage = 1;

let playerPos = {

    x: 0,
    y: 0

};


// ======================================================
// 적
// ======================================================

let enemies = [];


// ======================================================
// 실제 플레이어가 그은 선
// ======================================================

let lines = [];

let currentLine = null;

let dragging = false;


// ======================================================
// 공격 상태
// ======================================================

let attacking = false;


// ======================================================
// 선 제한
// ======================================================

let maxLines = 2;


// ======================================================
// 내부 정답 경로
// ======================================================

let solutionPath = [];


// ======================================================
// 이펙트
// ======================================================

let particles = [];

let slashTrails = [];

let effectAnimationRunning = false;


// ======================================================
// 적 수
// ======================================================

function getEnemyCount() {

    let count =
        Math.floor(stage / 5);

    count =
        Math.max(
            1,
            count
        );

    count =
        Math.min(
            7,
            count
        );

    return count;

}


// ======================================================
// 선 개수
// ======================================================

function updateMaxLines() {

    const enemyCount =
        getEnemyCount();

    maxLines =
        Math.max(
            2,
            enemyCount - 1
        );

}


// ======================================================
// 선 개수 표시
// ======================================================

function updateLineCount() {

    const remaining =
        maxLines -
        lines.length;

    lineCountText.textContent =
        `선: ${remaining} / ${maxLines}`;

}


// ======================================================
// 플레이어 초기 위치
// ======================================================

function resetPlayerPosition() {

    playerPos.x =
        width / 2;

    playerPos.y =
        height * 0.72;

    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";

}


// ======================================================
// 화면 크기
// ======================================================

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;

    resetPlayerPosition();

    draw();

}


window.addEventListener(
    "resize",
    resize
);


// ======================================================
// 거리
// ======================================================

function distance(a, b) {

    return Math.sqrt(

        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2

    );

}


// ======================================================
// 선 위의 점
// ======================================================

function pointOnLine(
    start,
    end,
    t
) {

    return {

        x:
            start.x +
            (end.x - start.x) * t,

        y:
            start.y +
            (end.y - start.y) * t

    };

}


// ======================================================
// 정답 경로 생성
//
// 경로끼리 지나치게 가까워지지 않도록
// 새로운 지점을 만들 때 기존 지점들과의
// 거리도 검사한다.
// ======================================================

function generateSolutionPath() {

    solutionPath = [];


    let current = {

        x:
            playerPos.x,

        y:
            playerPos.y

    };


    const points = [
        current
    ];


    for (
        let i = 0;
        i < maxLines;
        i++
    ) {

        let next = null;


        /*
            새로운 지점을 여러 번 시도한다.
        */

        for (
            let attempt = 0;
            attempt < 80;
            attempt++
        ) {

            const candidate = {

                x:
                    70 +
                    Math.random()
                    * (width - 140),

                y:
                    100 +
                    Math.random()
                    * (height * 0.48)

            };


            /*
                바로 이전 지점과
                최소 130px 이상 떨어져야 한다.
            */

            if (
                distance(
                    current,
                    candidate
                ) < 130
            ) {

                continue;

            }


            /*
                기존의 다른 지점과도
                너무 가까우면 피한다.

                이렇게 하면 경로가
                자기 자신 주변을 빙빙 도는 현상이 감소한다.
            */

            let tooClose = false;


            for (
                let j = 0;
                j < points.length - 1;
                j++
            ) {

                if (
                    distance(
                        points[j],
                        candidate
                    ) < 110
                ) {

                    tooClose = true;

                    break;

                }

            }


            if (
                tooClose
            ) {

                continue;

            }


            next =
                candidate;

            break;

        }


        /*
            충분히 좋은 위치를 찾지 못했다면
            전체 스테이지를 다시 생성한다.
        */

        if (
            next === null
        ) {

            return false;

        }


        solutionPath.push({

            start: {

                x:
                    current.x,

                y:
                    current.y

            },

            end: {

                x:
                    next.x,

                y:
                    next.y

            }

        });


        points.push(
            next
        );


        current =
            next;

    }


    return true;

}


// ======================================================
// 전체 경로 길이
// ======================================================

function getPathLength() {

    let total = 0;


    for (
        const segment of solutionPath
    ) {

        total +=
            distance(
                segment.start,
                segment.end
            );

    }


    return total;

}


// ======================================================
// 전체 경로에서 특정 거리의 위치
// ======================================================

function pointAtDistanceFromPath(
    targetDistance
) {

    let passed = 0;


    for (
        const segment of solutionPath
    ) {

        const segmentLength =
            distance(
                segment.start,
                segment.end
            );


        if (
            targetDistance <=
            passed + segmentLength
        ) {

            const localDistance =
                targetDistance -
                passed;


            const t =
                localDistance /
                segmentLength;


            return pointOnLine(

                segment.start,

                segment.end,

                t

            );

        }


        passed +=
            segmentLength;

    }


    const last =
        solutionPath[
            solutionPath.length - 1
        ];


    return {

        x:
            last.end.x,

        y:
            last.end.y

    };

}


// ======================================================
// 적 위치 생성
//
// ★ 이번 버전의 핵심
// ======================================================

function generateEnemyPositions() {

    const enemyCount =
        getEnemyCount();


    const totalLength =
        getPathLength();


    const positions = [];


    /*
        적 사이의 최소 실제 거리.

        적 크기가 40px이므로
        단순히 겹치지만 않는 수준이 아니라
        90px까지 떨어뜨린다.
    */

    const minimumDistance =
        90;


    /*
        적이 위치할 수 있는 범위.

        양 끝을 피해서 배치한다.
    */

    const startRatio =
        0.10;


    const endRatio =
        0.90;


    /*
        기본적으로 균등하게 배치하되
        랜덤성을 조금 추가한다.
    */

    for (
        let i = 0;
        i < enemyCount;
        i++
    ) {

        const baseRatio =

            startRatio +

            (
                endRatio -
                startRatio
            )
            *
            (
                (i + 0.5) /
                enemyCount
            );


        /*
            후반부에는 약간 더 랜덤하게.
        */

        const jitterAmount =
            Math.min(
                0.045,
                0.20 /
                enemyCount
            );


        let ratio =
            baseRatio +
            (
                Math.random() - 0.5
            )
            *
            jitterAmount;


        ratio =
            Math.max(
                startRatio,
                Math.min(
                    endRatio,
                    ratio
                )
            );


        const targetDistance =
            totalLength *
            ratio;


        const base =
            pointAtDistanceFromPath(
                targetDistance
            );


        /*
            경로에서 벗어나는 정도.

            기존 14px → 최대 20px.

            피격 범위가 24px이므로
            정답 경로를 정확하게 따라가야 한다.
        */

        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const offset =
            5 +
            Math.random()
            * 15;


        const position = {

            x:
                base.x +
                Math.cos(angle)
                * offset,

            y:
                base.y +
                Math.sin(angle)
                * offset

        };


        /*
            화면 밖으로 나가지 않도록 한다.
        */

        if (
            position.x < 45 ||
            position.x > width - 45 ||
            position.y < 80 ||
            position.y > height * 0.65
        ) {

            return null;

        }


        /*
            이전에 배치한 적과
            실제 화면 거리 검사.
        */

        for (
            const other of positions
        ) {

            if (
                distance(
                    position,
                    other
                )
                <
                minimumDistance
            ) {

                return null;

            }

        }


        positions.push(
            position
        );

    }


    return positions;

}


// ======================================================
// 적 생성
//
// 위치가 마음에 들지 않으면
// 경로부터 다시 생성한다.
// ======================================================

function spawnEnemies() {

    /*
        기존 적 삭제
    */

    enemies.forEach(
        enemy =>
            enemy.remove()
    );


    enemies = [];


    let positions = null;


    /*
        스테이지가 클수록
        더 엄격하게 생성한다.

        최대 500회까지 시도.
    */

    for (
        let attempt = 0;
        attempt < 500;
        attempt++
    ) {

        const pathOK =
            generateSolutionPath();


        if (!pathOK) {

            continue;

        }


        positions =
            generateEnemyPositions();


        if (
            positions !== null
        ) {

            break;

        }

    }


    /*
        이론적으로 거의 발생하지 않지만
        혹시 생성에 실패하면
        안전한 기본 배치를 만든다.
    */

    if (
        positions === null
    ) {

        generateSolutionPath();


        positions = [];


        const totalLength =
            getPathLength();


        for (
            let i = 0;
            i < getEnemyCount();
            i++
        ) {

            const ratio =
                (
                    i + 1
                )
                /
                (
                    getEnemyCount() + 1
                );


            positions.push(

                pointAtDistanceFromPath(

                    totalLength *
                    ratio

                )

            );

        }

    }


    /*
        실제 적 DOM 생성
    */

    positions.forEach(
        position => {

            const enemy =
                document.createElement(
                    "div"
                );


            enemy.classList.add(
                "enemy"
            );


            enemy.style.left =
                position.x + "px";


            enemy.style.top =
                position.y + "px";


            game.appendChild(
                enemy
            );


            enemies.push(
                enemy
            );

        }
    );

}


// ======================================================
// 터치 위치
// ======================================================

function getTouchPosition(e) {

    const touch =
        e.touches[0];


    return {

        x:
            touch.clientX,

        y:
            touch.clientY

    };

}


// ======================================================
// 터치 시작
// ======================================================

game.addEventListener(
    "touchstart",
    function(e) {

        if (attacking)
            return;


        if (
            e.target ===
            slashButton
        )
            return;


        if (
            lines.length >=
            maxLines
        )
            return;


        e.preventDefault();


        dragging = true;


        const pos =
            getTouchPosition(e);


        let start;


        /*
            첫 번째 선:
            플레이어 → 손가락
        */

        if (
            lines.length === 0
        ) {

            start = {

                x:
                    playerPos.x,

                y:
                    playerPos.y

            };

        }


        /*
            이후:
            이전 선의 끝 → 손가락
        */

        else {

            const last =
                lines[
                    lines.length - 1
                ];


            start = {

                x:
                    last.end.x,

                y:
                    last.end.y

            };

        }


        currentLine = {

            start: start,

            end: pos

        };


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 드래그
// ======================================================

game.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;


        e.preventDefault();


        const pos =
            getTouchPosition(e);


        currentLine.end =
            pos;


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 터치 종료
// ======================================================

game.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;


        dragging = false;


        if (currentLine) {

            lines.push(
                currentLine
            );


            currentLine =
                null;

        }


        updateLineCount();


        draw();

    }
);


// ======================================================
// 적 폭발 이펙트
//
// 기존의 효과 유지
// ======================================================

function createEnemyExplosion(
    x,
    y
) {

    /*
        중앙 섬광
    */

    particles.push({

        x: x,
        y: y,

        vx: 0,
        vy: 0,

        life: 18,
        maxLife: 18,

        size: 22,

        type: "flash"

    });


    /*
        붉은 파편
    */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const speed =
            2 +
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            life:
                25 +
                Math.random() * 20,

            maxLife: 45,

            size:
                2 +
                Math.random() * 5,

            type: "fragment"

        });

    }


    /*
        작은 입자
    */

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const speed =
            1 +
            Math.random() * 3;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            life:
                20 +
                Math.random() * 20,

            maxLife: 40,

            size:
                1 +
                Math.random() * 3,

            type: "spark"

        });

    }


    startEffectAnimation();

}


// ======================================================
// ★ 깔끔한 검격 이펙트
// ======================================================

function createSlashTrail(
    x,
    y,
    angle
) {

    slashTrails.push({

        x: x,

        y: y,

        angle: angle,

        life: 8,

        maxLife: 8

    });


    startEffectAnimation();

}


// ======================================================
// 이펙트 애니메이션 시작
// ======================================================

function startEffectAnimation() {

    if (
        effectAnimationRunning
    )
        return;


    effectAnimationRunning =
        true;


    requestAnimationFrame(
        updateEffects
    );

}


// ======================================================
// 이펙트 업데이트
// ======================================================

function updateEffects() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        실제 선
    */

    drawLines();


    // ==================================================
    // ★ 깔끔한 검격
    // ==================================================

    for (
        let i =
            slashTrails.length - 1;
        i >= 0;
        i--
    ) {

        const trail =
            slashTrails[i];


        trail.life--;


        const progress =
            1 -
            (
                trail.life /
                trail.maxLife
            );


        const alpha =
            (
                trail.life /
                trail.maxLife
            );


        ctx.save();


        ctx.translate(
            trail.x,
            trail.y
        );


        ctx.rotate(
            trail.angle
        );


        /*
            ----------------------------------
            바깥쪽의 얇은 검격
            ----------------------------------
        */

        ctx.globalAlpha =
            alpha * 0.25;


        ctx.lineWidth =
            10 *
            (
                1 - progress
            );


        ctx.lineCap =
            "round";


        ctx.strokeStyle =
            "white";


        ctx.beginPath();


        ctx.moveTo(
            -65,
            8
        );


        ctx.quadraticCurveTo(
            -5,
            -30,
            65,
            -5
        );


        ctx.stroke();


        /*
            ----------------------------------
            메인 검격
            ----------------------------------
        */

        ctx.globalAlpha =
            alpha * 0.8;


        ctx.lineWidth =
            5 *
            (
                1 - progress * 0.5
            );


        ctx.beginPath();


        ctx.moveTo(
            -60,
            6
        );


        ctx.quadraticCurveTo(
            0,
            -25,
            60,
            -2
        );


        ctx.stroke();


        /*
            ----------------------------------
            가장 밝은 중심선
            ----------------------------------
        */

        ctx.globalAlpha =
            alpha;


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.moveTo(
            -52,
            3
        );


        ctx.quadraticCurveTo(
            0,
            -21,
            54,
            -3
        );


        ctx.stroke();


        ctx.restore();


        if (
            trail.life <= 0
        ) {

            slashTrails.splice(
                i,
                1
            );

        }

    }


    // ==================================================
    // 적 폭발 / 기타 입자
    // ==================================================

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;


        p.vx *= 0.96;

        p.vy *= 0.96;


        p.life--;


        const alpha =
            p.life /
            p.maxLife;


        ctx.globalAlpha =
            alpha;


        /*
            중앙 섬광
        */

        if (
            p.type === "flash"
        ) {

            const size =
                p.size *
                (
                    1 -
                    p.life /
                    p.maxLife
                );


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "white";


            ctx.fill();

        }


        /*
            붉은 파편
        */

        else if (
            p.type === "fragment"
        ) {

            ctx.fillStyle =
                "#ff4444";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        /*
            작은 흰색 입자
        */

        else {

            ctx.fillStyle =
                "white";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }


    ctx.globalAlpha =
        1;


    /*
        이펙트가 남아 있으면 계속 실행
    */

    if (
        particles.length > 0 ||
        slashTrails.length > 0
    ) {

        requestAnimationFrame(
            updateEffects
        );

    }

    else {

        effectAnimationRunning =
            false;

    }

}


// ======================================================
// 실제 선 그리기
// ======================================================

function drawLines() {

    ctx.save();


    ctx.lineWidth =
        5;


    ctx.lineCap =
        "round";


    ctx.strokeStyle =
        "white";


    /*
        완성된 선
    */

    for (
        const line of lines
    ) {

        ctx.beginPath();


        ctx.moveTo(
            line.start.x,
            line.start.y
        );


        ctx.lineTo(
            line.end.x,
            line.end.y
        );


        ctx.stroke();

    }


    /*
        현재 그리고 있는 선
    */

    if (currentLine) {

        ctx.beginPath();


        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );


        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );


        ctx.stroke();

    }


    ctx.restore();

}


// ======================================================
// 기본 draw
// ======================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawLines();

}


// ======================================================
// 점과 선분 사이 거리
// ======================================================

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;


    const dy =
        b.y - a.y;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return distance(
            p,
            a
        );

    }


    const t =

        (
            (p.x - a.x) * dx +
            (p.y - a.y) * dy
        )
        /
        (
            dx * dx +
            dy * dy
        );


    const clamped =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closest = {

        x:
            a.x +
            clamped * dx,

        y:
            a.y +
            clamped * dy

    };


    return distance(
        p,
        closest
    );

}


// ======================================================
// 적 피격
// ======================================================

function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            ) {

                return;

            }


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };


            const hitDistance =
                pointToLineDistance(

                    enemyPos,

                    start,

                    current

                );


            /*
                ★ 난이도 상승

                기존 30px
                → 24px
            */

            if (
                hitDistance < 24
            ) {

                createEnemyExplosion(

                    enemyPos.x,

                    enemyPos.y

                );


                enemy.style.opacity =
                    "0";


                enemy.style.display =
                    "none";

            }

        }
    );

}


// ======================================================
// 베기 버튼
// ======================================================

slashButton.addEventListener(
    "click",
    function() {

        if (attacking)
            return;


        if (
            lines.length === 0
        )
            return;


        attacking = true;


        slashButton.disabled =
            true;


        moveAlongPath(0);

    }
);


// ======================================================
// 경로 이동
// ======================================================

function moveAlongPath(index) {

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            finishAttack,
            100
        );


        return;

    }


    const line =
        lines[index];


    const start =
        line.start;


    const end =
        line.end;


    /*
        매우 빠른 이동

        길이와 관계없이
        선 하나를 0.12초에 이동.
    */

    const duration =
        120;


    const startTime =
        performance.now();


    let previousX =
        start.x;


    let previousY =
        start.y;


    function animate(time) {

        const progress =
            Math.min(

                (
                    time -
                    startTime
                )
                /
                duration,

                1

            );


        playerPos.x =

            start.x +

            (
                end.x -
                start.x
            )
            *
            progress;


        playerPos.y =

            start.y +

            (
                end.y -
                start.y
            )
            *
            progress;


        player.style.left =
            playerPos.x + "px";


        player.style.top =
            playerPos.y + "px";


        /*
            이동 방향 계산
        */

        const angle =
            Math.atan2(

                playerPos.y -
                previousY,

                playerPos.x -
                previousX

            );


        /*
            ★ 깔끔한 검격 생성
        */

        createSlashTrail(

            playerPos.x,

            playerPos.y,

            angle

        );


        /*
            적 판정
        */

        checkEnemyHit(

            start,

            {

                x:
                    playerPos.x,

                y:
                    playerPos.y

            }

        );


        previousX =
            playerPos.x;


        previousY =
            playerPos.y;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


// ======================================================
// 공격 종료
// ======================================================

function finishAttack() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;

            }

        }
    );


    attacking = false;


    /*
        성공
    */

    if (
        alive === 0
    ) {

        setTimeout(
            nextStage,
            300
        );

    }


    /*
        실패
    */

    else {

        setTimeout(
            restartStage,
            300
        );

    }

}


// ======================================================
// 실패 → 같은 스테이지
// ======================================================

function restartStage() {

    /*
        선 초기화
    */

    lines = [];

    currentLine =
        null;


    /*
        플레이어 초기화
    */

    resetPlayerPosition();


    /*
        적 부활

        ★ 위치는 그대로 유지
    */

    enemies.forEach(
        enemy => {

            enemy.style.display =
                "block";

            enemy.style.opacity =
                "1";

        }
    );


    /*
        이펙트 제거
    */

    particles = [];

    slashTrails = [];


    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 다음 스테이지
// ======================================================

function nextStage() {

    stage++;


    stageText.textContent =
        "STAGE " + stage;


    /*
        플레이어 초기화
    */

    resetPlayerPosition();


    /*
        선 초기화
    */

    lines = [];

    currentLine =
        null;


    /*
        선 개수 변경
    */

    updateMaxLines();


    /*
        ★ 새로운 해결 가능한
        스테이지 생성
    */

    spawnEnemies();


    /*
        이펙트 초기화
    */

    particles = [];

    slashTrails = [];


    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 게임 시작
// ======================================================

resize();

updateMaxLines();

spawnEnemies();

updateLineCount();

draw();

</script>
