<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Line Slash</title>

<style>

* {
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

html, body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;
}


/* ==============================
   스테이지
================================ */

#stage {

    position: absolute;

    top: 20px;
    left: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   선 개수
================================ */

#lineCount {

    position: absolute;

    top: 20px;
    right: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   캔버스
================================ */

canvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}


/* ==============================
   플레이어
================================ */

#player {

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    z-index: 5;
}


/* ==============================
   적
================================ */

.enemy {

    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform:
        translate(-50%, -50%);

    z-index: 4;

    transition:
        opacity 0.12s;
}


/* ==============================
   베기 버튼
================================ */

#slashButton {

    position: absolute;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;

    border-radius: 15px;

    background: white;

    color: black;

    font-size: 20px;

    font-weight: bold;

    z-index: 20;
}


#slashButton:active {

    transform:
        translateX(-50%)
        scale(0.95);
}


#slashButton:disabled {

    opacity: 0.5;
}

</style>

</head>


<body>


<div id="game">

    <div id="stage">
        STAGE 1
    </div>


    <div id="lineCount">
        선: 2 / 2
    </div>


    <canvas id="canvas"></canvas>


    <div id="player"></div>


    <button id="slashButton">
        ⚔ 베기
    </button>

</div>


<script>


// ======================================================
// 기본 요소
// ======================================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById("player");

const slashButton =
    document.getElementById("slashButton");

const stageText =
    document.getElementById("stage");

const lineCountText =
    document.getElementById("lineCount");


// ======================================================
// 기본 변수
// ======================================================

let width;
let height;

let stage = 1;

let playerPos = {

    x: 0,
    y: 0

};


// ======================================================
// 적
// ======================================================

let enemies = [];


// ======================================================
// 플레이어가 실제로 그은 선
// ======================================================

let lines = [];

let currentLine = null;

let dragging = false;


// ======================================================
// 현재 공격 중인지
// ======================================================

let attacking = false;


// ======================================================
// 현재 스테이지의 최대 선 개수
// ======================================================

let maxLines = 2;


// ======================================================
// 내부적으로만 사용하는 정답 경로
//
// ★ 플레이어에게는 표시하지 않는다.
// ======================================================

let solutionPath = [];


// ======================================================
// 적 수 계산
// ======================================================

function getEnemyCount() {

    let count =
        Math.floor(stage / 5);


    // 최소 1

    count =
        Math.max(
            1,
            count
        );


    // 최대 7

    count =
        Math.min(
            7,
            count
        );


    return count;
}


// ======================================================
// 선 개수 계산
// ======================================================

function updateMaxLines() {

    const enemyCount =
        getEnemyCount();


    /*
        적 수 - 1

        단, 최소 2개
    */

    maxLines =
        Math.max(
            2,
            enemyCount - 1
        );

}


// ======================================================
// 선 개수 표시
// ======================================================

function updateLineCount() {

    const remaining =
        maxLines -
        lines.length;


    lineCountText.textContent =
        `선: ${remaining} / ${maxLines}`;

}


// ======================================================
// 플레이어 위치 초기화
// ======================================================

function resetPlayerPosition() {

    playerPos.x =
        width / 2;


    playerPos.y =
        height * 0.72;


    player.style.left =
        playerPos.x + "px";


    player.style.top =
        playerPos.y + "px";

}


// ======================================================
// 화면 크기
// ======================================================

function resize() {

    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width;


    canvas.height =
        height;


    resetPlayerPosition();


    draw();

}


window.addEventListener(
    "resize",
    resize
);


// ======================================================
// 두 점 사이 거리
// ======================================================

function distance(a, b) {

    return Math.sqrt(

        (a.x - b.x) ** 2 +

        (a.y - b.y) ** 2

    );

}


// ======================================================
// 선분 위의 특정 위치
// ======================================================

function pointOnLine(
    start,
    end,
    t
) {

    return {

        x:
            start.x +
            (end.x - start.x) * t,

        y:
            start.y +
            (end.y - start.y) * t

    };

}


// ======================================================
// 정답 경로 생성
// ======================================================

function generateSolutionPath() {

    solutionPath = [];


    /*
        정답 경로는

        플레이어
            ↓
        랜덤 지점
            ↓
        랜덤 지점
            ↓
        ...

        형태다.

        선 개수가 N개라면
        선분도 N개 생성한다.
    */


    let current = {

        x: playerPos.x,
        y: playerPos.y

    };


    for (
        let i = 0;
        i < maxLines;
        i++
    ) {

        let next;


        /*
            마지막 선이 아니면
            화면 위쪽 영역에 새로운
            랜덤 지점을 만든다.
        */

        next = {

            x:
                60 +
                Math.random()
                * (width - 120),

            y:
                100 +
                Math.random()
                * (height * 0.48)

        };


        /*
            현재 위치와 너무 가까우면
            다시 생성
        */

        let attempts = 0;


        while (
            distance(
                current,
                next
            ) < 100
            &&
            attempts < 20
        ) {

            next = {

                x:
                    60 +
                    Math.random()
                    * (width - 120),

                y:
                    100 +
                    Math.random()
                    * (height * 0.48)

            };


            attempts++;

        }


        solutionPath.push({

            start: {

                x: current.x,
                y: current.y

            },

            end: {

                x: next.x,
                y: next.y

            }

        });


        current = next;

    }

}


// ======================================================
// 적 생성
//
// ★ 정답 경로 위/근처에 적을 배치한다.
//
// 따라서 항상 적들을 전부 지나가는
// 해결 가능한 경로가 존재한다.
// ======================================================

function spawnEnemies() {

    // 기존 적 제거

    enemies.forEach(
        enemy =>
            enemy.remove()
    );


    enemies = [];


    // 정답 경로 생성

    generateSolutionPath();


    const enemyCount =
        getEnemyCount();


    /*
        적들을 정답 경로의
        서로 다른 랜덤 위치에 배치한다.

        같은 선분에 여러 적이 있어도
        문제는 없다.
    */

    for (
        let i = 0;
        i < enemyCount;
        i++
    ) {

        const enemy =
            document.createElement(
                "div"
            );


        enemy.classList.add(
            "enemy"
        );


        /*
            정답 경로 중
            랜덤한 선분 선택
        */

        const segmentIndex =
            Math.floor(
                Math.random()
                * solutionPath.length
            );


        const segment =
            solutionPath[
                segmentIndex
            ];


        /*
            선분의 시작/끝 부분은
            피해서 배치한다.

            그래야 적이 선분 끝에
            걸쳐 이상하게 생성되는 것을 방지.
        */

        const t =
            0.15 +
            Math.random() * 0.70;


        const base =
            pointOnLine(
                segment.start,
                segment.end,
                t
            );


        /*
            정답선에서 약간 떨어뜨린다.

            최대 약 15px.

            현재 공격 판정이 30px이므로
            정답 경로를 정확하게 따라가면
            충분히 맞는다.
        */

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const offset =
            Math.random()
            * 15;


        const x =
            base.x +
            Math.cos(angle)
            * offset;


        const y =
            base.y +
            Math.sin(angle)
            * offset;


        enemy.style.left =
            x + "px";


        enemy.style.top =
            y + "px";


        game.appendChild(
            enemy
        );


        enemies.push(
            enemy
        );

    }

}


// ======================================================
// 터치 위치
// ======================================================

function getTouchPosition(e) {

    const touch =
        e.touches[0];


    return {

        x: touch.clientX,

        y: touch.clientY

    };

}


// ======================================================
// 터치 시작
// ======================================================

game.addEventListener(
    "touchstart",
    function(e) {

        /*
            공격 중에는
            선을 그릴 수 없다.
        */

        if (attacking)
            return;


        /*
            베기 버튼을 누른 경우
        */

        if (
            e.target ===
            slashButton
        )
            return;


        /*
            선 개수 제한
        */

        if (
            lines.length >=
            maxLines
        ) {

            return;

        }


        e.preventDefault();


        dragging = true;


        const pos =
            getTouchPosition(e);


        let start;


        /*
            첫 번째 선

            플레이어 → 손가락
        */

        if (
            lines.length === 0
        ) {

            start = {

                x: playerPos.x,

                y: playerPos.y

            };

        }


        /*
            두 번째 선부터

            이전 선의 끝 →
            새로운 손가락 위치
        */

        else {

            const last =
                lines[
                    lines.length - 1
                ];


            start = {

                x:
                    last.end.x,

                y:
                    last.end.y

            };

        }


        currentLine = {

            start: start,

            end: pos

        };


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 드래그
// ======================================================

game.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;


        e.preventDefault();


        const pos =
            getTouchPosition(e);


        currentLine.end =
            pos;


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 터치 종료
// ======================================================

game.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;


        dragging = false;


        if (currentLine) {

            /*
                아주 짧은 선도
                일단 하나의 선으로 인정
            */

            lines.push(
                currentLine
            );


            currentLine =
                null;

        }


        updateLineCount();


        draw();

    }
);


// ======================================================
// 화면에 선 그리기
// ======================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";

    ctx.strokeStyle =
        "white";


    /*
        ★ 실제 플레이어가 그은 선만 표시

        solutionPath는 절대로 그리지 않는다.
    */

    for (
        const line of lines
    ) {

        ctx.beginPath();


        ctx.moveTo(
            line.start.x,
            line.start.y
        );


        ctx.lineTo(
            line.end.x,
            line.end.y
        );


        ctx.stroke();

    }


    /*
        현재 드래그 중인 선
    */

    if (currentLine) {

        ctx.beginPath();


        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );


        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );


        ctx.stroke();

    }

}


// ======================================================
// 점과 선분 사이 거리
// ======================================================

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;


    const dy =
        b.y - a.y;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return distance(
            p,
            a
        );

    }


    const t =

        (
            (p.x - a.x) * dx +
            (p.y - a.y) * dy
        )
        /
        (
            dx * dx +
            dy * dy
        );


    const clamped =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closest = {

        x:
            a.x +
            clamped * dx,

        y:
            a.y +
            clamped * dy

    };


    return distance(
        p,
        closest
    );

}


// ======================================================
// 적 공격 판정
// ======================================================

function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            /*
                이미 죽은 적
            */

            if (
                enemy.style.display ===
                "none"
            )
                return;


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };


            const hitDistance =
                pointToLineDistance(

                    enemyPos,

                    start,

                    current

                );


            /*
                선에서 30px 이내면
                적 처치
            */

            if (
                hitDistance < 30
            ) {

                enemy.style.opacity =
                    "0";


                enemy.style.display =
                    "none";

            }

        }
    );

}


// ======================================================
// 베기 버튼
// ======================================================

slashButton.addEventListener(
    "click",
    function() {

        if (attacking)
            return;


        if (
            lines.length === 0
        )
            return;


        attacking = true;


        slashButton.disabled =
            true;


        moveAlongPath(0);

    }
);


// ======================================================
// 경로 이동
// ======================================================

function moveAlongPath(index) {

    /*
        모든 선을 이동했으면
        공격 종료
    */

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            finishAttack,
            100
        );


        return;

    }


    const line =
        lines[index];


    const start =
        line.start;


    const end =
        line.end;


    /*
        ★ 매우 빠른 속도

        선의 길이에 관계없이
        한 선분당 0.12초.

        따라서 긴 선도 빠르게 이동한다.
    */

    const duration =
        120;


    const startTime =
        performance.now();


    function animate(time) {

        const progress =

            Math.min(

                (
                    time -
                    startTime
                )
                /
                duration,

                1

            );


        playerPos.x =

            start.x +

            (
                end.x -
                start.x
            )
            *
            progress;


        playerPos.y =

            start.y +

            (
                end.y -
                start.y
            )
            *
            progress;


        player.style.left =
            playerPos.x + "px";


        player.style.top =
            playerPos.y + "px";


        /*
            이동하면서 적을 공격
        */

        checkEnemyHit(

            start,

            {

                x:
                    playerPos.x,

                y:
                    playerPos.y

            }

        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


// ======================================================
// 공격 종료
// ======================================================

function finishAttack() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;

            }

        }
    );


    attacking = false;


    /*
        =====================================
        성공
        =====================================
    */

    if (
        alive === 0
    ) {

        setTimeout(
            nextStage,
            300
        );

    }


    /*
        =====================================
        실패
        =====================================
    */

    else {

        setTimeout(
            restartStage,
            300
        );

    }

}


// ======================================================
// 스테이지 실패 → 같은 스테이지 재시작
// ======================================================

function restartStage() {

    /*
        ★ 정답 경로는 새로 만들지 않는다.

        ★ 적 위치도 새로 만들지 않는다.

        따라서 방금 실패한 퍼즐을
        그대로 다시 풀 수 있다.
    */


    // 선 삭제

    lines = [];

    currentLine =
        null;


    // 플레이어 초기 위치

    resetPlayerPosition();


    /*
        죽었던 적 부활

        위치는 그대로다.
    */

    enemies.forEach(
        enemy => {

            enemy.style.display =
                "block";

            enemy.style.opacity =
                "1";

        }
    );


    // 선 개수 복구

    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 다음 스테이지
// ======================================================

function nextStage() {

    stage++;


    stageText.textContent =
        "STAGE " + stage;


    // 플레이어 초기 위치

    resetPlayerPosition();


    // 기존 선 삭제

    lines = [];

    currentLine =
        null;


    /*
        ★ 여기서만
        새로운 정답 경로와
        새로운 적 배치를 만든다.
    */

    updateMaxLines();

    spawnEnemies();


    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 게임 시작
// ======================================================

resize();


updateMaxLines();


spawnEnemies();


updateLineCount();


</script>

</body>
</html>
