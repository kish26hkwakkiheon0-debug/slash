<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Slash Game</title>

<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    -webkit-touch-callout: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        sans-serif;
}

body {
    touch-action: none;
}

button {
    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   게임 전체
===================================================== */

#game {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;
}


/* =====================================================
   메인 화면
===================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    z-index: 1000;

    overflow: hidden;
}

#menuCanvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 0;

    pointer-events: none;
}


/* 제목 */

#gameTitle {

    position: absolute;

    top: 17%;

    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 42px;

    font-weight: bold;

    letter-spacing: 3px;

    z-index: 10;

    pointer-events: none;

    text-shadow:
        0 0 15px
        rgba(255,255,255,0.25);
}


/* 시작 버튼 */

#startButton {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110px;
    height: 110px;

    transform:
        translate(-50%, -50%);

    border: none;

    padding: 0;

    margin: 0;

    background: white;

    clip-path:
        polygon(
            25% 10%,
            25% 90%,
            90% 50%
        );

    z-index: 100;

    touch-action: manipulation;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,0.5)
        );

    transition:
        transform 0.12s;
}

#startButton:active {

    transform:
        translate(-50%, -50%)
        scale(0.85);
}


/* 좌우 버튼 */

.menuButton {

    position: absolute;

    bottom: 16%;

    width: 100px;
    height: 90px;

    border: none;

    background: transparent;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    font-size: 14px;

    z-index: 20;

    touch-action: manipulation;
}

#characterButton {
    left: 12%;
}

#settingsButton {
    right: 12%;
}

.menuIcon {

    width: 46px;
    height: 46px;

    border: 2px solid #777;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;

    color: #ccc;

    background:
        rgba(255,255,255,0.02);
}


/* =====================================================
   모드 선택 화면
===================================================== */

#modeScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    z-index: 900;

    display: none;

    overflow: hidden;
}


/* 모드 제목 */

#modeTitle {

    position: absolute;

    top: 12%;

    width: 100%;

    text-align: center;

    color: white;

    font-size: 30px;

    font-weight: bold;

    letter-spacing: 2px;
}


/* 모드 목록 */

#modeList {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(82%, 360px);

    display: flex;

    flex-direction: column;

    gap: 15px;
}


/* 모드 버튼 */

.modeButton {

    width: 100%;

    min-height: 75px;

    border: 1px solid
        rgba(255,255,255,0.25);

    border-radius: 15px;

    background:
        rgba(255,255,255,0.04);

    color: white;

    text-align: left;

    padding:
        12px 20px;

    touch-action: manipulation;

    transition:
        transform 0.12s,
        background 0.12s;
}

.modeButton:active {

    transform:
        scale(0.96);

    background:
        rgba(255,255,255,0.12);
}

.modeName {

    display: block;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 5px;
}

.modeDescription {

    display: block;

    color: #aaa;

    font-size: 13px;
}


/* 뒤로가기 */

#backToMenu {

    position: absolute;

    left: 50%;

    bottom: 9%;

    transform:
        translateX(-50%);

    width: 120px;
    height: 45px;

    border: 1px solid #444;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.03);

    color: #aaa;

    font-size: 15px;

    touch-action: manipulation;
}

#backToMenu:active {

    transform:
        translateX(-50%)
        scale(0.95);
}


/* =====================================================
   게임 화면
===================================================== */

#gameScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    display: none;

    z-index: 10;

    overflow: hidden;
}


/* 게임 Canvas */

#canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 6;

    pointer-events: none;
}


/* =====================================================
   게임 UI
===================================================== */

#gameUI {

    position: absolute;

    top: 18px;
    left: 18px;
    right: 18px;

    z-index: 30;

    display: flex;

    justify-content:
        space-between;

    pointer-events: none;
}

#leftInfo {

    display: flex;

    flex-direction: column;

    gap: 5px;
}

#rightInfo {

    display: flex;

    flex-direction: column;

    align-items: flex-end;

    gap: 5px;
}

.uiText {

    color: white;

    text-shadow:
        0 0 7px
        rgba(255,255,255,0.3);
}

#stage {

    font-size: 21px;

    font-weight: bold;
}

#enemyCount {

    font-size: 16px;

    color: #ddd;
}

#lineCount {

    font-size: 16px;

    color: #ddd;
}

#scoreText {

    display: none;

    font-size: 17px;

    font-weight: bold;
}

#timerText {

    display: none;

    font-size: 20px;

    font-weight: bold;
}


/* =====================================================
   플레이어
===================================================== */

#player {

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    pointer-events: none;
}


/* =====================================================
   적
===================================================== */

.enemy {

    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform:
        translate(-50%, -50%);

    z-index: 7;

    box-shadow:
        0 0 10px #d33;

    pointer-events: none;

    transition:
        opacity 0.08s;
}


/* =====================================================
   베기 버튼
===================================================== */

#slashButton {

    position: absolute;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;

    border-radius: 15px;

    background: white;

    color: black;

    font-size: 20px;

    font-weight: bold;

    z-index: 50;

    touch-action: manipulation;
}

#slashButton:active {

    transform:
        translateX(-50%)
        scale(0.95);
}

#slashButton:disabled {

    opacity: 0.5;
}


/* =====================================================
   게임 오버 화면
===================================================== */

#gameOverScreen {

    position: absolute;

    inset: 0;

    background:
        rgba(0,0,0,0.82);

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: white;

    text-align: center;
}

#gameOverTitle {

    font-size: 38px;

    font-weight: bold;

    margin-bottom: 12px;
}

#gameOverInfo {

    color: #bbb;

    font-size: 16px;

    margin-bottom: 25px;
}

#restartButton {

    width: 150px;
    height: 55px;

    border: none;

    border-radius: 12px;

    background: white;

    color: black;

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 10px;
}

#menuButton {

    width: 150px;
    height: 45px;

    border: 1px solid #555;

    border-radius: 12px;

    background: transparent;

    color: #aaa;

    font-size: 15px;
}

</style>
</head>


<body>


<div id="game">


<!-- ===================================================
     메인 화면
=================================================== -->

<div id="startScreen">

    <canvas id="menuCanvas"></canvas>

    <div id="gameTitle">
        Slash Game
    </div>


    <button id="startButton"
            type="button"
            aria-label="게임 시작">
    </button>


    <button id="characterButton"
            class="menuButton"
            type="button">

        <div class="menuIcon">
            👤
        </div>

        <div>
            캐릭터
        </div>

    </button>


    <button id="settingsButton"
            class="menuButton"
            type="button">

        <div class="menuIcon">
            ⚙
        </div>

        <div>
            설정
        </div>

    </button>

</div>



<!-- ===================================================
     모드 선택
=================================================== -->

<div id="modeScreen">

    <div id="modeTitle">
        GAME MODE
    </div>


    <div id="modeList">

        <button class="modeButton"
                data-mode="score"
                type="button">

            <span class="modeName">
                🏆 점수 모드
            </span>

            <span class="modeDescription">
                적을 처치할 때마다 점수 +1
            </span>

        </button>


        <button class="modeButton"
                data-mode="infinite"
                type="button">

            <span class="modeName">
                ∞ 무한 모드
            </span>

            <span class="modeDescription">
                점수와 시간 제한 없이 계속 진행
            </span>

        </button>


        <button class="modeButton"
                data-mode="timed"
                type="button">

            <span class="modeName">
                ⏱ 시간제한 모드
            </span>

            <span class="modeDescription">
                제한시간 3분 동안 최대한 진행
            </span>

        </button>

    </div>


    <button id="backToMenu"
            type="button">
        뒤로가기
    </button>

</div>



<!-- ===================================================
     게임 화면
=================================================== -->

<div id="gameScreen">


    <div id="gameUI">

        <div id="leftInfo">

            <div id="stage"
                 class="uiText">
                STAGE 1
            </div>

            <div id="enemyCount"
                 class="uiText">
                적 1
            </div>

        </div>


        <div id="rightInfo">

            <div id="scoreText"
                 class="uiText">
                SCORE 0
            </div>

            <div id="timerText"
                 class="uiText">
                3:00
            </div>

            <div id="lineCount"
                 class="uiText">
                선 2 / 2
            </div>

        </div>

    </div>


    <canvas id="canvas"></canvas>


    <div id="player"></div>


    <button id="slashButton"
            type="button">
        ⚔ 베기
    </button>


    <!-- 게임 오버 -->

    <div id="gameOverScreen">

        <div id="gameOverTitle">
            TIME UP
        </div>

        <div id="gameOverInfo">
            STAGE 1
        </div>

        <button id="restartButton"
                type="button">
            다시 시작
        </button>

        <button id="menuButton"
                type="button">
            메인 메뉴
        </button>

    </div>

</div>


</div>



<script>

/* =====================================================
   DOM
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const modeScreen =
    document.getElementById(
        "modeScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const backToMenu =
    document.getElementById(
        "backToMenu"
    );

const characterButton =
    document.getElementById(
        "characterButton"
    );

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const menuCanvas =
    document.getElementById(
        "menuCanvas"
    );

const menuCtx =
    menuCanvas.getContext("2d");

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById(
        "player"
    );

const slashButton =
    document.getElementById(
        "slashButton"
    );

const stageText =
    document.getElementById(
        "stage"
    );

const enemyCountText =
    document.getElementById(
        "enemyCount"
    );

const lineCountText =
    document.getElementById(
        "lineCount"
    );

const scoreText =
    document.getElementById(
        "scoreText"
    );

const timerText =
    document.getElementById(
        "timerText"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const gameOverTitle =
    document.getElementById(
        "gameOverTitle"
    );

const gameOverInfo =
    document.getElementById(
        "gameOverInfo"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const menuButton =
    document.getElementById(
        "menuButton"
    );

const modeButtons =
    document.querySelectorAll(
        ".modeButton"
    );


/* =====================================================
   게임 변수
===================================================== */

let width = 0;
let height = 0;

let stage = 1;

let gameMode = null;

let score = 0;

let timeRemaining = 180;

let timerInterval = null;

let gameStarted = false;

let gameOver = false;

let playerPos = {
    x: 0,
    y: 0
};

let enemies = [];

let lines = [];

let currentLine = null;

let dragging = false;

let attacking = false;

let maxLines = 2;

let solutionPath = [];

let particles = [];

let slashTrails = [];

let effectAnimationRunning = false;


/* =====================================================
   메뉴 배경 애니메이션
===================================================== */

let menuObjects = [];

let menuTime = 0;


function resizeMenuCanvas() {

    menuCanvas.width =
        window.innerWidth;

    menuCanvas.height =
        window.innerHeight;
}


function createMenuObjects() {

    menuObjects = [];


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        menuObjects.push({

            x:
                Math.random() *
                window.innerWidth,

            y:
                100 +
                Math.random() *
                window.innerHeight *
                0.65,

            vx:
                (
                    Math.random() - 0.5
                ) * 0.25,

            vy:
                (
                    Math.random() - 0.5
                ) * 0.25,

            size:
                2 +
                Math.random() * 3
        });
    }
}


function animateMenu() {

    requestAnimationFrame(
        animateMenu
    );


    menuTime += 0.01;


    menuCtx.clearRect(
        0,
        0,
        menuCanvas.width,
        menuCanvas.height
    );


    /* 격자 */

    menuCtx.strokeStyle =
        "rgba(255,255,255,0.025)";

    menuCtx.lineWidth = 1;


    const gridSize = 80;


    for (
        let x = 0;
        x < menuCanvas.width;
        x += gridSize
    ) {

        menuCtx.beginPath();

        menuCtx.moveTo(
            x,
            0
        );

        menuCtx.lineTo(
            x,
            menuCanvas.height
        );

        menuCtx.stroke();
    }


    for (
        let y = 0;
        y < menuCanvas.height;
        y += gridSize
    ) {

        menuCtx.beginPath();

        menuCtx.moveTo(
            0,
            y
        );

        menuCtx.lineTo(
            menuCanvas.width,
            y
        );

        menuCtx.stroke();
    }


    /* 움직이는 점 */

    menuObjects.forEach(
        obj => {

            obj.x += obj.vx;
            obj.y += obj.vy;


            if (
                obj.x < -20 ||
                obj.x >
                menuCanvas.width + 20
            ) {

                obj.vx *= -1;
            }


            if (
                obj.y < 80 ||
                obj.y >
                menuCanvas.height - 100
            ) {

                obj.vy *= -1;
            }


            menuCtx.globalAlpha =
                0.18;

            menuCtx.fillStyle =
                "white";

            menuCtx.beginPath();

            menuCtx.arc(
                obj.x,
                obj.y,
                obj.size,
                0,
                Math.PI * 2
            );

            menuCtx.fill();
        }
    );


    /* 배경 검격 */

    const wave =
        Math.sin(menuTime) * 30;


    menuCtx.save();

    menuCtx.translate(
        menuCanvas.width / 2,
        menuCanvas.height / 2 + 80
    );

    menuCtx.rotate(-0.2);

    menuCtx.globalAlpha =
        0.07;

    menuCtx.strokeStyle =
        "white";

    menuCtx.lineWidth = 2;

    menuCtx.beginPath();

    menuCtx.moveTo(
        -250,
        wave
    );

    menuCtx.quadraticCurveTo(
        0,
        -100 + wave,
        250,
        wave
    );

    menuCtx.stroke();

    menuCtx.restore();


    /* 배경 플레이어 */

    const px =
        menuCanvas.width / 2 +
        Math.sin(menuTime * 0.8) *
        180;

    const py =
        menuCanvas.height * 0.68 +
        Math.cos(menuTime * 0.6) *
        35;


    menuCtx.globalAlpha =
        0.12;

    menuCtx.fillStyle =
        "white";

    menuCtx.beginPath();

    menuCtx.arc(
        px,
        py,
        9,
        0,
        Math.PI * 2
    );

    menuCtx.fill();


    /* 배경 적 */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const ex =
            menuCanvas.width / 2 +
            Math.cos(
                menuTime * 0.5 +
                i * 1.5
            ) *
            (180 + i * 25);

        const ey =
            menuCanvas.height * 0.35 +
            Math.sin(
                menuTime * 0.7 +
                i
            ) *
            55;


        menuCtx.globalAlpha =
            0.08;

        menuCtx.fillStyle =
            "#ff4444";

        menuCtx.beginPath();

        menuCtx.arc(
            ex,
            ey,
            8,
            0,
            Math.PI * 2
        );

        menuCtx.fill();
    }


    menuCtx.globalAlpha = 1;
}


/* =====================================================
   화면 크기
===================================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width;

    canvas.height =
        height;


    resetPlayerPosition();

    draw();
}


function resetPlayerPosition() {

    playerPos.x =
        width / 2;

    playerPos.y =
        height * 0.72;


    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";
}


/* =====================================================
   적 수 / 선 수
===================================================== */

function getEnemyCount() {

    let count =
        Math.floor(
            stage / 5
        );


    count =
        Math.max(
            1,
            count
        );


    count =
        Math.min(
            7,
            count
        );


    return count;
}


function updateMaxLines() {

    const enemyCount =
        getEnemyCount();


    maxLines =
        Math.max(
            2,
            enemyCount - 1
        );
}


function updateLineCount() {

    const remaining =
        Math.max(
            0,
            maxLines -
            lines.length
        );


    lineCountText.textContent =
        `선 ${remaining} / ${maxLines}`;
}


function updateEnemyCount() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;
            }
        }
    );


    enemyCountText.textContent =
        `적 ${alive}`;
}


function updateScore() {

    scoreText.textContent =
        `SCORE ${score}`;
}


/* =====================================================
   거리 계산
===================================================== */

function distance(a, b) {

    return Math.sqrt(

        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2

    );
}


function pointOnLine(
    start,
    end,
    t
) {

    return {

        x:
            start.x +
            (end.x - start.x) * t,

        y:
            start.y +
            (end.y - start.y) * t
    };
}


/* =====================================================
   정답 경로 생성
===================================================== */

function generateSolutionPath() {

    solutionPath = [];


    let current = {

        x: playerPos.x,
        y: playerPos.y
    };


    const points = [
        current
    ];


    for (
        let i = 0;
        i < maxLines;
        i++
    ) {

        let next = null;


        for (
            let attempt = 0;
            attempt < 100;
            attempt++
        ) {

            const candidate = {

                x:
                    70 +
                    Math.random() *
                    (width - 140),

                y:
                    100 +
                    Math.random() *
                    (height * 0.48)
            };


            if (
                distance(
                    current,
                    candidate
                ) < 130
            ) {

                continue;
            }


            let tooClose = false;


            for (
                const point of points
            ) {

                if (
                    distance(
                        point,
                        candidate
                    ) < 100
                ) {

                    tooClose = true;

                    break;
                }
            }


            if (tooClose)
                continue;


            next = candidate;

            break;
        }


        if (!next)
            return false;


        solutionPath.push({

            start: {
                x: current.x,
                y: current.y
            },

            end: {
                x: next.x,
                y: next.y
            }
        });


        points.push(next);

        current = next;
    }


    return true;
}


function getPathLength() {

    let total = 0;


    for (
        const segment of
        solutionPath
    ) {

        total +=
            distance(
                segment.start,
                segment.end
            );
    }


    return total;
}


function pointAtDistanceFromPath(
    targetDistance
) {

    let passed = 0;


    for (
        const segment of
        solutionPath
    ) {

        const length =
            distance(
                segment.start,
                segment.end
            );


        if (
            targetDistance <=
            passed + length
        ) {

            const t =
                (
                    targetDistance -
                    passed
                ) /
                length;


            return pointOnLine(
                segment.start,
                segment.end,
                t
            );
        }


        passed += length;
    }


    return solutionPath[
        solutionPath.length - 1
    ].end;
}


/* =====================================================
   적 배치
===================================================== */

function generateEnemyPositions() {

    const count =
        getEnemyCount();


    const totalLength =
        getPathLength();


    const positions = [];


    /*
       적 사이 최소 거리

       후반부에서도 너무 붙지 않도록
       적 수가 많아질수록 조금 더 넓게
    */

    const minimumDistance =
        90;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const baseRatio =

            0.10 +
            0.80 *
            (
                (i + 0.5) /
                count
            );


        let ratio =
            baseRatio +
            (
                Math.random() - 0.5
            ) *
            Math.min(
                0.045,
                0.20 / count
            );


        ratio =
            Math.max(
                0.10,
                Math.min(
                    0.90,
                    ratio
                )
            );


        const base =
            pointAtDistanceFromPath(
                totalLength *
                ratio
            );


        const angle =
            Math.random() *
            Math.PI * 2;


        const offset =
            5 +
            Math.random() * 15;


        const position = {

            x:
                base.x +
                Math.cos(angle) *
                offset,

            y:
                base.y +
                Math.sin(angle) *
                offset
        };


        if (
            position.x < 45 ||
            position.x >
            width - 45 ||
            position.y < 80 ||
            position.y >
            height * 0.65
        ) {

            return null;
        }


        for (
            const other of positions
        ) {

            if (
                distance(
                    position,
                    other
                ) < minimumDistance
            ) {

                return null;
            }
        }


        positions.push(
            position
        );
    }


    return positions;
}


function spawnEnemies() {

    enemies.forEach(
        enemy => enemy.remove()
    );


    enemies = [];


    let positions = null;


    /*
       정답 경로와 적 배치를
       만족할 때까지 다시 생성
    */

    for (
        let attempt = 0;
        attempt < 500;
        attempt++
    ) {

        if (
            !generateSolutionPath()
        ) {

            continue;
        }


        positions =
            generateEnemyPositions();


        if (positions)
            break;
    }


    /*
       혹시 생성 실패했을 때
       강제 생성
    */

    if (!positions) {

        generateSolutionPath();


        positions = [];


        const total =
            getPathLength();


        for (
            let i = 0;
            i < getEnemyCount();
            i++
        ) {

            positions.push(

                pointAtDistanceFromPath(

                    total *
                    (i + 1) /
                    (
                        getEnemyCount() +
                        1
                    )

                )
            );
        }
    }


    positions.forEach(
        position => {

            const enemy =
                document.createElement(
                    "div"
                );


            enemy.className =
                "enemy";


            enemy.style.left =
                position.x + "px";


            enemy.style.top =
                position.y + "px";


            gameScreen.appendChild(
                enemy
            );


            enemies.push(enemy);
        }
    );


    updateEnemyCount();
}


/* =====================================================
   화면 그리기
===================================================== */

function drawLines() {

    ctx.save();


    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";

    ctx.strokeStyle =
        "white";


    for (
        const line of lines
    ) {

        ctx.beginPath();

        ctx.moveTo(
            line.start.x,
            line.start.y
        );

        ctx.lineTo(
            line.end.x,
            line.end.y
        );

        ctx.stroke();
    }


    if (currentLine) {

        ctx.beginPath();

        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );

        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );

        ctx.stroke();
    }


    ctx.restore();
}


function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawLines();
}


/* =====================================================
   터치 좌표
===================================================== */

function getPointerPosition(e) {

    return {

        x: e.clientX,

        y: e.clientY
    };
}


/* =====================================================
   선 그리기
===================================================== */

gameScreen.addEventListener(
    "pointerdown",
    function(e) {

        if (
            !gameStarted ||
            gameOver ||
            attacking
        )
            return;


        if (
            e.target === slashButton
        )
            return;


        if (
            lines.length >= maxLines
        )
            return;


        dragging = true;


        const pos =
            getPointerPosition(e);


        let start;


        /*
           첫 번째 선:
           플레이어 → 손
        */

        if (
            lines.length === 0
        ) {

            start = {

                x: playerPos.x,

                y: playerPos.y
            };

        }


        /*
           두 번째 선부터:
           이전 선의 끝 → 손
        */

        else {

            const last =
                lines[
                    lines.length - 1
                ];


            start = {

                x: last.end.x,

                y: last.end.y
            };
        }


        currentLine = {

            start: start,

            end: {

                x: pos.x,

                y: pos.y
            }
        };


        try {

            gameScreen.setPointerCapture(
                e.pointerId
            );

        }
        catch(err) {}


        draw();
    }
);


gameScreen.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            !currentLine
        )
            return;


        currentLine.end =
            getPointerPosition(e);


        draw();
    }
);


function finishDrawing(e) {

    if (!dragging)
        return;


    dragging = false;


    try {

        gameScreen.releasePointerCapture(
            e.pointerId
        );

    }
    catch(err) {}


    if (
        currentLine
    ) {

        const length =
            distance(
                currentLine.start,
                currentLine.end
            );


        if (
            length > 20
        ) {

            lines.push(
                currentLine
            );
        }


        currentLine = null;
    }


    updateLineCount();

    draw();
}

    "pointerup",
    finishDrawing
);


gameScreen.addEventListener(
    "pointercancel",
    finishDrawing
);


/* =====================================================
   선-적 충돌
===================================================== */

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return distance(
            p,
            a
        );
    }


    const t =
        (
            (p.x - a.x) * dx +
            (p.y - a.y) * dy
        )
        /
        (
            dx * dx +
            dy * dy
        );


    const clamped =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closest = {

        x:
            a.x +
            clamped * dx,

        y:
            a.y +
            clamped * dy
    };


    return distance(
        p,
        closest
    );
}


function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            ) {

                return;
            }


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2
            };


            const hitDistance =
                pointToLineDistance(
                    enemyPos,
                    start,
                    current
                );


            if (
                hitDistance < 24
            ) {

                killEnemy(
                    enemy,
                    enemyPos
                );
            }
        }
    );
}


/* =====================================================
   적 처치
===================================================== */

function killEnemy(
    enemy,
    position
) {

    if (
        enemy.style.display ===
        "none"
    ) {

        return;
    }


    createEnemyExplosion(
        position.x,
        position.y
    );


    enemy.style.opacity =
        "0";

    enemy.style.display =
        "none";


    /*
       점수 모드에서만 점수 증가
    */

    if (
        gameMode === "score"
    ) {

        score++;

        updateScore();
    }


    updateEnemyCount();
}


/* =====================================================
   적 폭발 이펙트
===================================================== */

function createEnemyExplosion(
    x,
    y
) {

    particles.push({

        x: x,

        y: y,

        vx: 0,

        vy: 0,

        life: 18,

        maxLife: 18,

        size: 22,

        type: "flash"
    });


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;


        const speed =
            2 +
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                25 +
                Math.random() * 20,

            maxLife: 45,

            size:
                2 +
                Math.random() * 5,

            type:
                "fragment"
        });
    }


    startEffectAnimation();
}


/* =====================================================
   깔끔한 검격 이펙트
===================================================== */

function createSlashTrail(
    x,
    y,
    angle
) {

    slashTrails.push({

        x: x,

        y: y,

        angle: angle,

        life: 8,

        maxLife: 8
    });


    startEffectAnimation();
}


function startEffectAnimation() {

    if (
        effectAnimationRunning
    )
        return;


    effectAnimationRunning =
        true;


    requestAnimationFrame(
        updateEffects
    );
}


function updateEffects() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawLines();


    /* 검격 */

    for (
        let i =
            slashTrails.length - 1;

        i >= 0;

        i--
    ) {

        const trail =
            slashTrails[i];


        trail.life--;


        const progress =
            1 -
            trail.life /
            trail.maxLife;


        const alpha =
            trail.life /
            trail.maxLife;


        ctx.save();


        ctx.translate(
            trail.x,
            trail.y
        );


        ctx.rotate(
            trail.angle
        );


        /*
           부드러운 외곽 검격
        */

        ctx.globalAlpha =
            alpha * 0.25;

        ctx.lineWidth =
            10 *
            (1 - progress);

        ctx.lineCap =
            "round";

        ctx.strokeStyle =
            "white";


        ctx.beginPath();

        ctx.moveTo(
            -65,
            8
        );

        ctx.quadraticCurveTo(
            -5,
            -30,
            65,
            -5
        );

        ctx.stroke();


        /*
           중앙 검격
        */

        ctx.globalAlpha =
            alpha * 0.8;

        ctx.lineWidth =
            5 *
            (1 -
                progress * 0.5);


        ctx.beginPath();

        ctx.moveTo(
            -60,
            6
        );

        ctx.quadraticCurveTo(
            0,
            -25,
            60,
            -2
        );

        ctx.stroke();


        /*
           얇은 날
        */

        ctx.globalAlpha =
            alpha;

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            -52,
            3
        );

        ctx.quadraticCurveTo(
            0,
            -21,
            54,
            -3
        );

        ctx.stroke();


        ctx.restore();


        if (
            trail.life <= 0
        ) {

            slashTrails.splice(
                i,
                1
            );
        }
    }


    /* 폭발 파티클 */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;


        p.vx *= 0.96;

        p.vy *= 0.96;


        p.life--;


        ctx.globalAlpha =
            p.life /
            p.maxLife;


        if (
            p.type ===
            "flash"
        ) {

            const size =
                p.size *
                (
                    1 -
                    p.life /
                    p.maxLife
                );


            ctx.fillStyle =
                "white";


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        else {

            ctx.fillStyle =
                "#ff4444";


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }


    ctx.globalAlpha = 1;


    if (
        particles.length > 0 ||
        slashTrails.length > 0
    ) {

        requestAnimationFrame(
            updateEffects
        );

    }

    else {

        effectAnimationRunning =
            false;
    }
}

/* =====================================================
   플레이어 이동
===================================================== */

function moveAlongPath(index) {

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            finishAttack,
            100
        );

        return;
    }


    const line =
        lines[index];


    const start =
        line.start;

    const end =
        line.end;


    /*
       매우 빠른 베기 속도
    */

    const duration = 120;


    const startTime =
        performance.now();


    let previousX =
        start.x;

    let previousY =
        start.y;


    function animate(time) {

        const progress =
            Math.min(

                (
                    time -
                    startTime
                ) /
                duration,

                1
            );


        playerPos.x =
            start.x +
            (
                end.x -
                start.x
            ) *
            progress;


        playerPos.y =
            start.y +
            (
                end.y -
                start.y
            ) *
            progress;


        player.style.left =
            playerPos.x + "px";


        player.style.top =
            playerPos.y + "px";


        const angle =
            Math.atan2(

                playerPos.y -
                previousY,

                playerPos.x -
                previousX
            );


        createSlashTrail(
            playerPos.x,
            playerPos.y,
            angle
        );


        checkEnemyHit(

            start,

            {
                x: playerPos.x,

                y: playerPos.y
            }
        );


        previousX =
            playerPos.x;

        previousY =
            playerPos.y;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =====================================================
   베기 종료
===================================================== */

function finishAttack() {

    if (gameOver)
        return;


    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;
            }
        }
    );


    attacking = false;


    /*
       모든 적 처치
    */

    if (
        alive === 0
    ) {

        setTimeout(
            nextStage,
            300
        );
    }


    /*
       실패
    */

    else {

        setTimeout(
            restartStage,
            300
        );
    }
}

   스테이지 실패 리셋
===================================================== */

function restartStage() {

    if (gameOver)
        return;


    /*
       선 초기화
    */

    lines = [];

    currentLine = null;


    /*
       플레이어 초기화

    resetPlayerPosition();


    /*
       적 위치는 절대 바꾸지 않는다.

       죽은 적만 다시 살린다.
    */

    enemies.forEach(
        enemy => {

            enemy.style.display =
                "block";

            enemy.style.opacity =
                "1";
        }
    );


    particles = [];

    slashTrails = [];


    attacking = false;

    dragging = false;


    updateEnemyCount();

    updateLineCount();

    draw();


    slashButton.disabled =
        false;
}

function startGame(mode) {

    if (
        gameStarted
    ) {

        return;
    }


    gameStarted = true;

    gameOver = false;

    gameMode = mode;


    /*
       모드 화면 숨기기
    */

    modeScreen.style.display =
        "none";


    /*
       게임 화면 표시
    */

    gameScreen.style.display =
        "block";


    /*
       초기값
    */

    stage = 1;

    score = 0;

    timeRemaining = 180;


    lines = [];

    currentLine = null;

    particles = [];

    slashTrails = [];


    attacking = false;

    dragging = false;


    /*
       UI
    */

    stageText.textContent =
        "STAGE 1";


    updateScore();

       모드별 UI
    */

        gameMode === "score"
    ) {

        scoreText.style.display =

        timerText.style.display =

    }

    else if (
        gameMode === "timed"
    ) {

        scoreText.style.display =
            "none";

        timerText.style.display =
            "block";

        updateTimerText();

    }

    else {

        scoreText.style.display =
            "none";

        timerText.style.display =
            "none";
    }


    /*
       화면 크기
    */

    resize();


    /*
       선 개수
    */

    updateMaxLines();


    /*
       첫 스테이지 생성
    */

    spawnEnemies();


    updateEnemyCount();

    updateLineCount();

    draw();


    slashButton.disabled =
        false;


    /*
       시간제한 모드 시작
    */

    if (
        gameMode === "timed"
    ) {

        startTimer();
    }
}


/* =====================================================
   타이머
===================================================== */

function startTimer() {

    stopTimer();


    timerInterval =
        setInterval(
            function() {

                if (
                    gameOver
                ) {

                    return;
                }


                timeRemaining--;


                updateTimerText();


                if (
                    timeRemaining <= 0
                ) {

                    timeRemaining = 0;

                    updateTimerText();

                    endGameByTime();
                }

            },
            1000
        );
}


function stopTimer() {

    if (
        timerInterval !== null
    ) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;
    }
}


function updateTimerText() {

    const minutes =
        Math.floor(
            timeRemaining / 60
        );


    const seconds =
        timeRemaining % 60;


    timerText.textContent =

        `${minutes}:` +
        `${seconds
            .toString()
            .padStart(2, "0")}`;
}


/* =====================================================
   시간 종료
===================================================== */

function endGameByTime() {

    if (gameOver)
        return;


    gameOver = true;


    attacking = false;

    dragging = false;


    stopTimer();


    slashButton.disabled =
        true;


    gameOverTitle.textContent =
        "TIME UP";


    gameOverInfo.textContent =
        `STAGE ${stage}`;


    gameOverScreen.style.display =
        "flex";
}

        return;
    }


    openModeScreen();
}


startButton.addEventListener(
    "pointerup",
    openModes,
    {
        passive: false
    }
);


startButton.addEventListener(
    "touchend",
    openModes,
    {
        passive: false
    }
);


startButton.addEventListener(
    "click",
    openModes
);


/* =====================================================
   모드 선택 화면 뒤로가기
===================================================== */

backToMenu.addEventListener(
    "pointerup",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        closeModeScreen();
    }
);


/* =====================================================
   캐릭터 / 설정
===================================================== */

characterButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();
    }
);


settingsButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();
    }
);


/* =====================================================
   창 크기 변경
===================================================== */

window.addEventListener(
    "resize",
    function() {

        resizeMenuCanvas();


        if (
            gameStarted
        ) {

            resize();
        }
    }
);


/* =====================================================
   초기화
===================================================== */

resizeMenuCanvas();

createMenuObjects();

animateMenu();

</script>
