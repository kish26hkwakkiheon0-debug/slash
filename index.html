<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Line Slash</title>

<style>

* {
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

html, body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}

#game {

    position: relative;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;
}


/* ==============================
   스테이지
================================ */

#stage {

    position: absolute;

    top: 20px;
    left: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   선 개수
================================ */

#lineCount {

    position: absolute;

    top: 20px;
    right: 20px;

    color: white;

    font-size: 20px;

    z-index: 10;
}


/* ==============================
   Canvas
================================ */

canvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 6;

    pointer-events: none;
}


/* ==============================
   플레이어
================================ */

#player {

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    z-index: 5;

    box-shadow:
        0 0 10px white,
        0 0 20px white;
}


/* ==============================
   적
================================ */

.enemy {

    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform:
        translate(-50%, -50%);

    z-index: 4;

    box-shadow:
        0 0 10px #d33;

    transition:
        opacity 0.08s,
        transform 0.08s;
}


/* ==============================
   베기 버튼
================================ */

#slashButton {

    position: absolute;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;

    border-radius: 15px;

    background: white;

    color: black;

    font-size: 20px;

    font-weight: bold;

    z-index: 20;
}

#slashButton:active {

    transform:
        translateX(-50%)
        scale(0.95);
}

#slashButton:disabled {

    opacity: 0.5;
}

</style>

</head>


<body>


<div id="game">

    <div id="stage">
        STAGE 1
    </div>


    <div id="lineCount">
        선: 2 / 2
    </div>


    <canvas id="canvas"></canvas>


    <div id="player"></div>


    <button id="slashButton">
        ⚔ 베기
    </button>

</div>


<script>


// ======================================================
// 기본 요소
// ======================================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById("player");

const slashButton =
    document.getElementById("slashButton");

const stageText =
    document.getElementById("stage");

const lineCountText =
    document.getElementById("lineCount");


// ======================================================
// 기본 변수
// ======================================================

let width;
let height;

let stage = 1;

let playerPos = {

    x: 0,
    y: 0

};


// ======================================================
// 적
// ======================================================

let enemies = [];


// ======================================================
// 플레이어가 그은 선
// ======================================================

let lines = [];

let currentLine = null;

let dragging = false;


// ======================================================
// 공격 상태
// ======================================================

let attacking = false;


// ======================================================
// 선 제한
// ======================================================

let maxLines = 2;


// ======================================================
// 내부 정답 경로
// ======================================================

let solutionPath = [];


// ======================================================
// 이펙트 입자
// ======================================================

let particles = [];


// ======================================================
// 베기 잔상
// ======================================================

let slashTrails = [];


// ======================================================
// 애니메이션 루프
// ======================================================

let effectAnimationRunning = false;


// ======================================================
// 적 수
// ======================================================

function getEnemyCount() {

    let count =
        Math.floor(stage / 5);


    count =
        Math.max(
            1,
            count
        );


    count =
        Math.min(
            7,
            count
        );


    return count;
}


// ======================================================
// 선 개수
// ======================================================

function updateMaxLines() {

    const enemyCount =
        getEnemyCount();


    maxLines =
        Math.max(
            2,
            enemyCount - 1
        );

}


// ======================================================
// 선 개수 표시
// ======================================================

function updateLineCount() {

    const remaining =
        maxLines -
        lines.length;


    lineCountText.textContent =
        `선: ${remaining} / ${maxLines}`;

}


// ======================================================
// 플레이어 위치 초기화
// ======================================================

function resetPlayerPosition() {

    playerPos.x =
        width / 2;


    playerPos.y =
        height * 0.72;


    player.style.left =
        playerPos.x + "px";


    player.style.top =
        playerPos.y + "px";

}


// ======================================================
// 화면 크기
// ======================================================

function resize() {

    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width;


    canvas.height =
        height;


    resetPlayerPosition();


    draw();

}


window.addEventListener(
    "resize",
    resize
);


// ======================================================
// 거리
// ======================================================

function distance(a, b) {

    return Math.sqrt(

        (a.x - b.x) ** 2 +
        (a.y - b.y) ** 2

    );

}


// ======================================================
// 선 위의 점
// ======================================================

function pointOnLine(
    start,
    end,
    t
) {

    return {

        x:
            start.x +
            (end.x - start.x) * t,

        y:
            start.y +
            (end.y - start.y) * t

    };

}


// ======================================================
// 정답 경로 생성
// ======================================================

function generateSolutionPath() {

    solutionPath = [];


    let current = {

        x:
            playerPos.x,

        y:
            playerPos.y

    };


    for (
        let i = 0;
        i < maxLines;
        i++
    ) {

        let next;


        let attempts = 0;


        do {

            next = {

                x:
                    60 +
                    Math.random()
                    * (width - 120),

                y:
                    100 +
                    Math.random()
                    * (height * 0.47)

            };


            attempts++;


        } while (

            distance(
                current,
                next
            ) < 120

            &&

            attempts < 30

        );


        solutionPath.push({

            start: {

                x:
                    current.x,

                y:
                    current.y

            },

            end: {

                x:
                    next.x,

                y:
                    next.y

            }

        });


        current = next;

    }

}


// ======================================================
// 경로 전체의 길이
// ======================================================

function getPathLength() {

    let total = 0;


    for (
        const segment of solutionPath
    ) {

        total +=
            distance(
                segment.start,
                segment.end
            );

    }


    return total;

}


// ======================================================
// 경로의 전체 길이 기준으로
// 특정 거리만큼 떨어진 위치 찾기
// ======================================================

function pointAtDistanceFromPath(
    targetDistance
) {

    let passed = 0;


    for (
        const segment of solutionPath
    ) {

        const segmentLength =
            distance(
                segment.start,
                segment.end
            );


        if (
            targetDistance <=
            passed + segmentLength
        ) {

            const localDistance =
                targetDistance -
                passed;


            const t =
                localDistance /
                segmentLength;


            return pointOnLine(

                segment.start,

                segment.end,

                t

            );

        }


        passed +=
            segmentLength;

    }


    const last =
        solutionPath[
            solutionPath.length - 1
        ];


    return {

        x: last.end.x,

        y: last.end.y

    };

}


// ======================================================
// 적 위치 생성
//
// ★ 핵심 변경 부분
//
// 적을 각각 랜덤한 선분에 넣는 대신
// "전체 경로"에 균등하게 배치한다.
//
// 따라서 한곳에 몰릴 가능성이 크게 줄어든다.
// ======================================================

function generateEnemyPositions() {

    const enemyCount =
        getEnemyCount();


    const totalLength =
        getPathLength();


    const positions = [];


    /*
        적 사이 최소 거리

        적 크기가 약 40px이므로
        75px 정도로 떨어뜨린다.
    */

    const minimumDistance =
        75;


    /*
        적이 경로 전체에
        골고루 퍼지도록 한다.

        예:

        적 4명이라면

        20%
        40%
        60%
        80%

        근처에 배치.
    */

    for (
        let i = 0;
        i < enemyCount;
        i++
    ) {

        /*
            균등 위치 + 약간의 랜덤 오차
        */

        const baseRatio =
            (i + 1)
            /
            (enemyCount + 1);


        /*
            랜덤 오차

            너무 크게 움직이면
            적이 특정 구역으로 몰릴 수 있으므로
            작게 유지한다.
        */

        const jitter =
            (
                Math.random() - 0.5
            )
            *
            Math.min(
                0.10,
                0.6 / enemyCount
            );


        let ratio =
            baseRatio + jitter;


        ratio =
            Math.max(
                0.08,
                Math.min(
                    0.92,
                    ratio
                )
            );


        const targetDistance =
            totalLength * ratio;


        const base =
            pointAtDistanceFromPath(
                targetDistance
            );


        /*
            정답선에서 살짝 벗어나게 한다.

            최대 14px.

            공격 판정은 30px이므로
            여전히 충분히 맞출 수 있다.
        */

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const offset =
            Math.random()
            * 14;


        const position = {

            x:
                base.x +
                Math.cos(angle)
                * offset,

            y:
                base.y +
                Math.sin(angle)
                * offset

        };


        positions.push(
            position
        );

    }


    /*
        혹시라도 경로 자체가 서로 가까이
        지나가는 경우까지 검사한다.
    */

    for (
        let i = 0;
        i < positions.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < positions.length;
            j++
        ) {

            if (
                distance(
                    positions[i],
                    positions[j]
                )
                <
                minimumDistance
            ) {

                return null;

            }

        }

    }


    return positions;

}


// ======================================================
// 적 생성
//
// 위치가 좋지 않으면
// 정답 경로부터 다시 생성한다.
// ======================================================

function spawnEnemies() {

    /*
        기존 적 제거
    */

    enemies.forEach(
        enemy =>
            enemy.remove()
    );


    enemies = [];


    let positions = null;


    /*
        적들이 충분히 떨어질 때까지
        새로운 경로를 생성한다.
    */

    let attempts = 0;


    while (
        positions === null &&
        attempts < 100
    ) {

        generateSolutionPath();


        positions =
            generateEnemyPositions();


        attempts++;

    }


    /*
        혹시 100번 안에 성공하지 못했다면
        현재 경로를 그대로 사용한다.
    */

    if (positions === null) {

        positions =
            [];


        for (
            let i = 0;
            i < getEnemyCount();
            i++
        ) {

            const segment =
                solutionPath[
                    i %
                    solutionPath.length
                ];


            positions.push(

                pointOnLine(
                    segment.start,
                    segment.end,
                    0.5
                )

            );

        }

    }


    /*
        적 DOM 생성
    */

    positions.forEach(
        position => {

            const enemy =
                document.createElement(
                    "div"
                );


            enemy.classList.add(
                "enemy"
            );


            enemy.style.left =
                position.x + "px";


            enemy.style.top =
                position.y + "px";


            game.appendChild(
                enemy
            );


            enemies.push(
                enemy
            );

        }
    );

}


// ======================================================
// 터치 위치
// ======================================================

function getTouchPosition(e) {

    const touch =
        e.touches[0];


    return {

        x:
            touch.clientX,

        y:
            touch.clientY

    };

}


// ======================================================
// 터치 시작
// ======================================================

game.addEventListener(
    "touchstart",
    function(e) {

        if (attacking)
            return;


        if (
            e.target ===
            slashButton
        )
            return;


        if (
            lines.length >=
            maxLines
        )
            return;


        e.preventDefault();


        dragging = true;


        const pos =
            getTouchPosition(e);


        let start;


        if (
            lines.length === 0
        ) {

            start = {

                x:
                    playerPos.x,

                y:
                    playerPos.y

            };

        }

        else {

            const last =
                lines[
                    lines.length - 1
                ];


            start = {

                x:
                    last.end.x,

                y:
                    last.end.y

            };

        }


        currentLine = {

            start: start,

            end: pos

        };


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 드래그
// ======================================================

game.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;


        e.preventDefault();


        const pos =
            getTouchPosition(e);


        currentLine.end =
            pos;


        draw();

    },
    {
        passive: false
    }
);


// ======================================================
// 터치 종료
// ======================================================

game.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;


        dragging = false;


        if (currentLine) {

            lines.push(
                currentLine
            );


            currentLine =
                null;

        }


        updateLineCount();


        draw();

    }
);


// ======================================================
// 적 폭발 이펙트
// ======================================================

function createEnemyExplosion(
    x,
    y
) {

    /*
        중앙 섬광
    */

    particles.push({

        x: x,
        y: y,

        vx: 0,
        vy: 0,

        life: 18,
        maxLife: 18,

        size: 22,

        type: "flash"

    });


    /*
        바깥쪽으로 튀는 파편
    */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const speed =
            2 +
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            life:
                25 +
                Math.random() * 20,

            maxLife: 45,

            size:
                2 +
                Math.random() * 5,

            type: "fragment"

        });

    }


    /*
        작은 빛 입자
    */

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const speed =
            1 +
            Math.random() * 3;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            life:
                20 +
                Math.random() * 20,

            maxLife: 40,

            size:
                1 +
                Math.random() * 3,

            type: "spark"

        });

    }


    startEffectAnimation();

}


// ======================================================
// 베기 잔상 생성
// ======================================================

function createSlashTrail(
    x,
    y,
    angle
) {

    slashTrails.push({

        x: x,

        y: y,

        angle: angle,

        life: 10,

        maxLife: 10

    });


    /*
        베기 주변의 작은 입자
    */

    for (
        let i = 0;
        i < 2;
        i++
    ) {

        particles.push({

            x:
                x +
                (
                    Math.random()
                    - 0.5
                ) * 20,

            y:
                y +
                (
                    Math.random()
                    - 0.5
                ) * 20,

            vx:
                (
                    Math.random()
                    - 0.5
                ) * 2,

            vy:
                (
                    Math.random()
                    - 0.5
                ) * 2,

            life: 12,

            maxLife: 12,

            size: 2,

            type: "slash"

        });

    }


    startEffectAnimation();

}


// ======================================================
// 이펙트 애니메이션 시작
// ======================================================

function startEffectAnimation() {

    if (
        effectAnimationRunning
    )
        return;


    effectAnimationRunning =
        true;


    requestAnimationFrame(
        updateEffects
    );

}


// ======================================================
// 이펙트 업데이트
// ======================================================

function updateEffects() {

    ctx.save();


    /*
        Canvas 전체를 초기화한 뒤
        선과 이펙트를 다시 그림
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        실제 선
    */

    drawLines();


    // ----------------------------------
    // 베기 잔상
    // ----------------------------------

    for (
        let i =
            slashTrails.length - 1;
        i >= 0;
        i--
    ) {

        const trail =
            slashTrails[i];


        trail.life--;


        const alpha =
            trail.life /
            trail.maxLife;


        ctx.save();


        ctx.translate(
            trail.x,
            trail.y
        );


        ctx.rotate(
            trail.angle
        );


        /*
            넓은 베기 궤적
        */

        ctx.globalAlpha =
            alpha * 0.65;


        ctx.lineWidth =
            12 * alpha;


        ctx.lineCap =
            "round";


        ctx.strokeStyle =
            "white";


        ctx.beginPath();


        ctx.moveTo(
            -55,
            0
        );


        ctx.quadraticCurveTo(
            0,
            -18,
            55,
            0
        );


        ctx.stroke();


        /*
            중심의 밝은 선
        */

        ctx.globalAlpha =
            alpha;


        ctx.lineWidth =
            4;


        ctx.beginPath();


        ctx.moveTo(
            -50,
            0
        );


        ctx.quadraticCurveTo(
            0,
            -14,
            50,
            0
        );


        ctx.stroke();


        ctx.restore();


        if (
            trail.life <= 0
        ) {

            slashTrails.splice(
                i,
                1
            );

        }

    }


    // ----------------------------------
    // 입자
    // ----------------------------------

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;


        p.vx *= 0.96;

        p.vy *= 0.96;


        p.life--;


        const alpha =
            p.life /
            p.maxLife;


        if (
            p.type === "flash"
        ) {

            /*
                중앙 섬광
            */

            const size =
                p.size *
                (
                    1 -
                    p.life /
                    p.maxLife
                );


            ctx.globalAlpha =
                alpha;


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "white";


            ctx.fill();

        }

        else if (
            p.type === "fragment"
        ) {

            /*
                적 파편
            */

            ctx.globalAlpha =
                alpha;


            ctx.fillStyle =
                "#ff4444";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }

        else {

            /*
                빛 / 베기 입자
            */

            ctx.globalAlpha =
                alpha;


            ctx.fillStyle =
                "white";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }


    ctx.restore();


    /*
        아직 이펙트가 남아있으면
        계속 업데이트
    */

    if (
        particles.length > 0 ||
        slashTrails.length > 0
    ) {

        requestAnimationFrame(
            updateEffects
        );

    }

    else {

        effectAnimationRunning =
            false;

    }

}


// ======================================================
// 선 그리기
// ======================================================

function drawLines() {

    ctx.save();


    ctx.lineWidth =
        5;


    ctx.lineCap =
        "round";


    ctx.strokeStyle =
        "white";


    for (
        const line of lines
    ) {

        ctx.beginPath();


        ctx.moveTo(
            line.start.x,
            line.start.y
        );


        ctx.lineTo(
            line.end.x,
            line.end.y
        );


        ctx.stroke();

    }


    /*
        현재 그리고 있는 선
    */

    if (currentLine) {

        ctx.beginPath();


        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );


        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );


        ctx.stroke();

    }


    ctx.restore();

}


// ======================================================
// 기본 draw
// ======================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawLines();

}


// ======================================================
// 점과 선분 사이 거리
// ======================================================

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;


    const dy =
        b.y - a.y;


    if (
        dx === 0 &&
        dy === 0
    ) {

        return distance(
            p,
            a
        );

    }


    const t =

        (
            (p.x - a.x) * dx +
            (p.y - a.y) * dy
        )
        /
        (
            dx * dx +
            dy * dy
        );


    const clamped =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closest = {

        x:
            a.x +
            clamped * dx,

        y:
            a.y +
            clamped * dy

    };


    return distance(
        p,
        closest
    );

}


// ======================================================
// 적 피격
// ======================================================

function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            )
                return;


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };


            const hitDistance =
                pointToLineDistance(

                    enemyPos,

                    start,

                    current

                );


            /*
                적이 선에서 30px 이내면
                처치
            */

            if (
                hitDistance < 30
            ) {

                /*
                    ★ 적 폭발 이펙트
                */

                createEnemyExplosion(

                    enemyPos.x,

                    enemyPos.y

                );


                /*
                    적 제거
                */

                enemy.style.opacity =
                    "0";


                enemy.style.display =
                    "none";

            }

        }
    );

}


// ======================================================
// 베기 버튼
// ======================================================

slashButton.addEventListener(
    "click",
    function() {

        if (attacking)
            return;


        if (
            lines.length === 0
        )
            return;


        attacking = true;


        slashButton.disabled =
            true;


        moveAlongPath(0);

    }
);


// ======================================================
// 경로 이동
// ======================================================

function moveAlongPath(index) {

    if (
        index >=
        lines.length
    ) {

        setTimeout(
            finishAttack,
            100
        );


        return;

    }


    const line =
        lines[index];


    const start =
        line.start;


    const end =
        line.end;


    /*
        ★ 매우 빠른 베기

        선의 길이와 상관없이
        0.12초 동안 이동.
    */

    const duration =
        120;


    const startTime =
        performance.now();


    let previousX =
        start.x;

    let previousY =
        start.y;


    function animate(time) {

        const progress =
            Math.min(

                (
                    time -
                    startTime
                )
                /
                duration,

                1

            );


        playerPos.x =

            start.x +

            (
                end.x -
                start.x
            )
            *
            progress;


        playerPos.y =

            start.y +

            (
                end.y -
                start.y
            )
            *
            progress;


        player.style.left =
            playerPos.x + "px";


        player.style.top =
            playerPos.y + "px";


        /*
            이동 방향
        */

        const angle =
            Math.atan2(

                playerPos.y -
                previousY,

                playerPos.x -
                previousX

            );


        /*
            ★ 베기 궤적 생성
        */

        createSlashTrail(

            playerPos.x,

            playerPos.y,

            angle

        );


        /*
            적 공격
        */

        checkEnemyHit(

            start,

            {

                x:
                    playerPos.x,

                y:
                    playerPos.y

            }

        );


        previousX =
            playerPos.x;

        previousY =
            playerPos.y;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


// ======================================================
// 공격 종료
// ======================================================

function finishAttack() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;

            }

        }
    );


    attacking = false;


    /*
        성공
    */

    if (
        alive === 0
    ) {

        setTimeout(
            nextStage,
            300
        );

    }


    /*
        실패
    */

    else {

        setTimeout(
            restartStage,
            300
        );

    }

}


// ======================================================
// 실패 → 같은 스테이지 재시작
// ======================================================

function restartStage() {

    /*
        선 삭제
    */

    lines = [];

    currentLine =
        null;


    /*
        플레이어 원위치
    */

    resetPlayerPosition();


    /*
        적 부활

        위치는 그대로다.
    */

    enemies.forEach(
        enemy => {

            enemy.style.display =
                "block";

            enemy.style.opacity =
                "1";

        }
    );


    /*
        이펙트 정리
    */

    particles = [];

    slashTrails = [];


    /*
        선 개수 복구
    */

    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 다음 스테이지
// ======================================================

function nextStage() {

    stage++;


    stageText.textContent =
        "STAGE " + stage;


    /*
        플레이어 원위치
    */

    resetPlayerPosition();


    /*
        선 삭제
    */

    lines = [];

    currentLine =
        null;


    /*
        새로운 선 제한
    */

    updateMaxLines();


    /*
        새로운 해결 가능한
        적 배치 생성
    */

    spawnEnemies();


    /*
        이펙트 초기화
    */

    particles = [];

    slashTrails = [];


    updateLineCount();


    draw();


    slashButton.disabled =
        false;


    attacking = false;

}


// ======================================================
// 게임 시작
// ======================================================

resize();

updateMaxLines();

spawnEnemies();

updateLineCount();

draw();

</script>
