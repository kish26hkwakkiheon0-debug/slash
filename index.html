<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Line Slash</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    background: #050505;
    overflow: hidden;
}

/* 스테이지 */

#stage {
    position: absolute;
    top: 20px;
    left: 20px;

    color: white;
    font-size: 20px;

    z-index: 10;
}

/* 캔버스 */

canvas {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}

/* 플레이어 */

#player {
    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: white;

    transform: translate(-50%, -50%);

    z-index: 5;
}

/* 적 */

.enemy {
    position: absolute;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #d33;

    transform: translate(-50%, -50%);

    z-index: 4;

    transition: opacity 0.2s;
}

/* 베기 버튼 */

#slashButton {

    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 150px;
    height: 60px;

    border: none;
    border-radius: 15px;

    background: white;
    color: black;

    font-size: 20px;
    font-weight: bold;

    z-index: 20;
}

#slashButton:active {
    transform: translateX(-50%) scale(0.95);
}

</style>
</head>


<body>

<div id="game">

    <div id="stage">
        STAGE 1
    </div>

    <canvas id="canvas"></canvas>

    <div id="player"></div>

    <button id="slashButton">
        ⚔ 베기
    </button>

</div>


<script>

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const player =
    document.getElementById("player");

const slashButton =
    document.getElementById("slashButton");


// ----------------------------------
// 기본 변수
// ----------------------------------

let width;
let height;

let stage = 1;

let playerPos = {
    x: 0,
    y: 0
};


// 현재 존재하는 적들

let enemies = [];


// 지금까지 그린 선

let lines = [];


// 현재 그리고 있는 선

let currentLine = null;

let dragging = false;


// ----------------------------------
// 화면 크기 설정
// ----------------------------------

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    playerPos.x = width / 2;

    playerPos.y = height * 0.72;

    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";

    draw();
}

window.addEventListener(
    "resize",
    resize
);


// ----------------------------------
// 스테이지의 적 수 계산
// ----------------------------------

function getEnemyCount() {

    let count =
        Math.floor(stage / 5);

    // 최소 1
    count = Math.max(1, count);

    // 최대 7
    count = Math.min(7, count);

    return count;
}


// ----------------------------------
// 적 생성
// ----------------------------------

function spawnEnemies() {

    // 기존 적 제거

    enemies.forEach(enemy => {

        enemy.remove();

    });

    enemies = [];


    const enemyCount =
        getEnemyCount();


    for (let i = 0;
         i < enemyCount;
         i++) {

        const enemy =
            document.createElement("div");

        enemy.classList.add("enemy");


        // ----------------------------------
        // 랜덤 위치
        // ----------------------------------

        let x;
        let y;

        let validPosition = false;


        while (!validPosition) {

            // 화면 양쪽 끝에 너무 붙지 않도록
            x =
                Math.random()
                * (width - 100)
                + 50;


            // 상단~중간 영역에 배치
            y =
                Math.random()
                * (height * 0.55)
                + 80;


            validPosition = true;


            // 플레이어와 너무 가까우면 다시 생성

            const playerDistance =
                Math.sqrt(
                    (x - playerPos.x) ** 2 +
                    (y - playerPos.y) ** 2
                );


            if (playerDistance < 150) {

                validPosition = false;

            }


            // 다른 적과 너무 가까운 경우

            for (const other of enemies) {

                const rect =
                    other.getBoundingClientRect();

                const otherX =
                    rect.left +
                    rect.width / 2;

                const otherY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(
                        (x - otherX) ** 2 +
                        (y - otherY) ** 2
                    );


                if (distance < 80) {

                    validPosition = false;

                    break;

                }

            }

        }


        enemy.style.left =
            x + "px";

        enemy.style.top =
            y + "px";


        game.appendChild(enemy);

        enemies.push(enemy);

    }

}


// ----------------------------------
// 터치 위치
// ----------------------------------

function getTouchPosition(e) {

    const touch =
        e.touches[0];

    return {

        x: touch.clientX,
        y: touch.clientY

    };

}


// ----------------------------------
// 터치 시작
// ----------------------------------

game.addEventListener(
    "touchstart",
    function(e) {

        if (e.target === slashButton)
            return;

        e.preventDefault();

        dragging = true;

        const pos =
            getTouchPosition(e);


        let start;


        // 첫 번째 선
        // 플레이어에서 시작

        if (lines.length === 0) {

            start = {

                x: playerPos.x,
                y: playerPos.y

            };

        }

        // 두 번째 선부터는
        // 이전 선의 끝에서 시작

        else {

            const last =
                lines[lines.length - 1];

            start = {

                x: last.end.x,
                y: last.end.y

            };

        }


        currentLine = {

            start: start,

            end: pos

        };


        draw();

    },
    { passive: false }
);


// ----------------------------------
// 드래그
// ----------------------------------

game.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging)
            return;

        e.preventDefault();


        const pos =
            getTouchPosition(e);


        currentLine.end =
            pos;


        draw();

    },
    { passive: false }
);


// ----------------------------------
// 터치 종료
// ----------------------------------

game.addEventListener(
    "touchend",
    function() {

        if (!dragging)
            return;

        dragging = false;


        if (currentLine) {

            lines.push(
                currentLine
            );

            currentLine = null;

        }


        draw();

    }
);


// ----------------------------------
// 선 그리기
// ----------------------------------

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.strokeStyle = "white";


    // 고정된 선

    for (const line of lines) {

        ctx.beginPath();

        ctx.moveTo(
            line.start.x,
            line.start.y
        );

        ctx.lineTo(
            line.end.x,
            line.end.y
        );

        ctx.stroke();

    }


    // 현재 드래그 중인 선

    if (currentLine) {

        ctx.beginPath();

        ctx.moveTo(
            currentLine.start.x,
            currentLine.start.y
        );

        ctx.lineTo(
            currentLine.end.x,
            currentLine.end.y
        );

        ctx.stroke();

    }

}


// ----------------------------------
// 점과 선 사이 거리
// ----------------------------------

function pointToLineDistance(
    p,
    a,
    b
) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    if (dx === 0 && dy === 0) {

        return Math.sqrt(
            (p.x - a.x) ** 2 +
            (p.y - a.y) ** 2
        );

    }


    const t =
        (
            (p.x - a.x) * dx +
            (p.y - a.y) * dy
        )
        /
        (dx * dx + dy * dy);


    const clamped =
        Math.max(
            0,
            Math.min(1, t)
        );


    const closest = {

        x: a.x + clamped * dx,

        y: a.y + clamped * dy

    };


    return Math.sqrt(

        (p.x - closest.x) ** 2 +

        (p.y - closest.y) ** 2

    );

}


// ----------------------------------
// 적 피격 판정
// ----------------------------------

function checkEnemyHit(
    start,
    current
) {

    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            )
                return;


            const rect =
                enemy.getBoundingClientRect();


            const enemyPos = {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2

            };


            const distance =
                pointToLineDistance(
                    enemyPos,
                    start,
                    current
                );


            // 선에서 30px 이내면 피격

            if (distance < 30) {

                enemy.style.opacity =
                    "0";


                setTimeout(
                    () => {

                        enemy.style.display =
                            "none";

                    },
                    200
                );

            }

        }
    );

}


// ----------------------------------
// 플레이어 이동
// ----------------------------------

function moveAlongPath(index) {

    if (index >= lines.length) {

        setTimeout(
            checkStageClear,
            300
        );

        return;

    }


    const line =
        lines[index];


    const start =
        line.start;

    const end =
        line.end;


    const duration = 350;

    const startTime =
        performance.now();


    function animate(time) {

        const progress =
            Math.min(
                (time - startTime)
                / duration,
                1
            );


        playerPos.x =
            start.x +
            (end.x - start.x)
            * progress;


        playerPos.y =
            start.y +
            (end.y - start.y)
            * progress;


        player.style.left =
            playerPos.x + "px";

        player.style.top =
            playerPos.y + "px";


        checkEnemyHit(
            start,
            {
                x: playerPos.x,
                y: playerPos.y
            }
        );


        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        }

        else {

            moveAlongPath(
                index + 1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}


// ----------------------------------
// 베기 버튼
// ----------------------------------

slashButton.addEventListener(
    "click",
    function() {

        if (lines.length === 0)
            return;


        slashButton.disabled =
            true;


        moveAlongPath(0);

    }
);


// ----------------------------------
// 스테이지 클리어 확인
// ----------------------------------

function checkStageClear() {

    let alive = 0;


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display !==
                "none"
            ) {

                alive++;

            }

        }
    );


    if (alive === 0) {

        setTimeout(
            nextStage,
            500
        );

    }

    else {

        slashButton.disabled =
            false;

    }

}


// ----------------------------------
// 다음 스테이지
// ----------------------------------

function nextStage() {

    stage++;


    document.getElementById(
        "stage"
    ).textContent =
        "STAGE " + stage;


    // 플레이어 초기 위치

    playerPos.x =
        width / 2;

    playerPos.y =
        height * 0.72;


    player.style.left =
        playerPos.x + "px";

    player.style.top =
        playerPos.y + "px";


    // 기존 경로 삭제

    lines = [];

    currentLine = null;


    // 새로운 적 생성

    spawnEnemies();


    slashButton.disabled =
        false;


    draw();

}


// ----------------------------------
// 게임 시작
// ----------------------------------

resize();

spawnEnemies();

</script>

</body>
</html>
